name: Fix Ivan label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace Vanya with Ivan only in camp page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<b>Ваня</b>', '<b>Иван</b>', 1)
          s = s.replace('<h3 id="mn">Ваня</h3>', '<h3 id="mn">Иван</h3>', 1)
          s = s.replace("{n:'Ваня',p:'pos-vanya'", "{n:'Иван',p:'pos-vanya'", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Use Ivan name for Monday mentor"
          git push
