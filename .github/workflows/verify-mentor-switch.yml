name: Verify mentor switch
on:
  push:
    paths:
      - .github/workflows/verify-mentor-switch.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify Ivan and Stas
        shell: bash
        run: |
          cat >/tmp/check.cjs <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const raw='https://raw.githubusercontent.com/romadav73-gif/extreme-kids-camp/6fb8a09a2e6de88a33e966c3f1a99c590ca382e9/index.html';
            const url='https://htmlpreview.github.io/?'+raw;
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:430,height:932}});
            await p.goto(url,{waitUntil:'load',timeout:90000}); await p.waitForTimeout(2500);
            const before=await p.evaluate(()=>{const i=document.getElementById('mentorImage'); return {alt:i?.alt,w:i?.naturalWidth,h:i?.naturalHeight,name:document.getElementById('mentorName')?.textContent||''}});
            console.log('MONDAY',before); if(before.alt!=='Иван'||before.name!=='Иван'||before.w!==1229||before.h!==1536) throw new Error('Ivan mismatch');
            await p.locator('.day-tab').nth(1).click(); await p.waitForTimeout(1200);
            const after=await p.evaluate(()=>{const i=document.getElementById('mentorImage'); return {alt:i?.alt,w:i?.naturalWidth,h:i?.naturalHeight,name:document.getElementById('mentorName')?.textContent||''}});
            console.log('TUESDAY',after); if(after.alt!=='Стас'||after.name!=='Стас'||after.w!==1229||after.h!==1536) throw new Error('Stas mismatch');
            await b.close(); console.log('MENTOR_SWITCH_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/check.cjs
