name: Extract Growth OS 6 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-growth6-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct validated production source
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, pathlib, re
          files=['p00_0','p00_1','p00_2','p00_3','p00_4','p00_5','p01','p02','p03']
          src=pathlib.Path('growth6-production-src')
          joined=''.join((src/f).read_text(encoding='utf-8').strip() for f in files)
          compressed=base64.b64decode(re.sub(r'\s+','',joined),validate=True)
          page=gzip.decompress(compressed)
          digest=hashlib.sha256(page).hexdigest()
          expected='26f1ad0993e2238703e9e91bc4e3b20b2879f57c98b1deae80a2e45e8eccd497'
          if digest != expected:
              raise RuntimeError(f'SHA mismatch: {digest}')
          out=pathlib.Path('growth6-source')
          out.mkdir(exist_ok=True)
          text=page.decode('utf-8')
          (out/'current.html').write_text(text,encoding='utf-8')
          (out/'SHA256.txt').write_text(digest+'\n',encoding='utf-8')
          keywords=[
            'const ROLES','const PEOPLE','const DEFAULT_STATE','function normalizeState','function currentMonthKey',
            'function renderTasks','function taskForm','function renderGroups','function renderGoals','function renderStas',
            'function renderMentor','function renderAdmin','function renderTeam','function renderSettings','function navigate',
            'async function syncNow','function saveState','function mergeState','data-action="deleteTask"','deleteTask',
            'monthSelect','activeMonth','selectedMonth','ownerId','roleId','window.EKGrowthOS'
          ]
          lines=text.splitlines()
          hits=[]
          for i,line in enumerate(lines,1):
              for key in keywords:
                  if key in line:
                      hits.append(f'{i}: {key}: {line[:260]}')
          (out/'STRUCTURE.txt').write_text('\n'.join(hits)+'\n',encoding='utf-8')
          print('bytes',len(page),'lines',len(lines),'sha256',digest,'hits',len(hits))
          PY
      - name: Commit source snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6-source/current.html growth6-source/SHA256.txt growth6-source/STRUCTURE.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Growth OS 6 source snapshot and structure index"
          git push
