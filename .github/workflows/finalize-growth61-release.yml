name: Finalize and publish EXTREME KIDS Growth OS 6.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-growth61-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build final Growth OS 6.1
        shell: bash
        run: |
          set -euo pipefail
          python3 growth6-source/patch_v61.py
          python3 <<'PY'
          from pathlib import Path
          import json

          source = Path('growth6-source/v6.1.html')
          html = source.read_text(encoding='utf-8').replace('Growth OS 6.0', 'Growth OS 6.1')
          source.write_text(html, encoding='utf-8')

          required = [
              "const VERSION='6.1.0'",
              "manager:{name:'Софа'",
              "function renderManager()",
              "function taskMonthKey(task)",
              "function currentSales()",
              "function goalDerived(goal)",
              "Удалять задачи могут только Роман и Софа",
              "https://extreme-kids-troparevo-control.vercel.app/",
              "window.EKGrowthOS",
          ]
          for marker in required:
              if marker not in html:
                  raise RuntimeError(f'Missing release marker: {marker}')

          for folder in ('growth-os', 'growth61-live'):
              out = Path(folder)
              out.mkdir(exist_ok=True)
              (out / 'index.html').write_text(html, encoding='utf-8')
              (out / 'BUILD.json').write_text(json.dumps({
                  'version': '6.1.0',
                  'build': '2026.08.31-manager-month-sync',
                  'features': [
                      'month-scoped task filtering',
                      'Sofia manager role',
                      'owner and Sofia task deletion',
                      'automatic goals and mentor aggregation',
                      'shared encrypted database sync'
                  ]
              }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 <<'PY'
          from pathlib import Path
          import re
          html = Path('growth6-source/v6.1.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('Application script missing')
          Path('/tmp/growth61-app.js').write_text(max(scripts, key=len), encoding='utf-8')
          PY
          node --check /tmp/growth61-app.js

      - name: Browser boot check
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory growth-os >/tmp/growth61-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          key='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          url="http://127.0.0.1:8765/#w=ek-growth61-release-${GITHUB_RUN_ID}&k=${key}&r=manager&t=release"
          timeout 40s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --virtual-time-budget=12000 --dump-dom "$url" >/tmp/growth61-dom.html 2>/tmp/growth61-chrome.log || true
          cat /tmp/growth61-chrome.log
          grep -q 'Софа · управляющая' /tmp/growth61-dom.html
          grep -q 'ОПЕРАЦИОННЫЙ ИНДЕКС' /tmp/growth61-dom.html
          grep -q "const VERSION='6.1.0'" /tmp/growth61-dom.html

      - name: Commit ready site
        shell: bash
        run: |
          set -euo pipefail
          cat > growth-os/RELEASE.txt <<EOF
          EXTREME KIDS Growth OS 6.1.0
          Build: 2026.08.31-manager-month-sync
          Month filtering: ready
          Sofia manager profile: ready
          Owner and Sofia task deletion: ready
          Automatic mentor and goal aggregation: ready
          Shared encrypted database sync: ready
          Browser boot check: passed
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cp growth-os/RELEASE.txt growth61-live/RELEASE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6-source/v6.1.html growth61-production-src growth-os growth61-live
          if git diff --cached --quiet; then
            echo 'Release already current'
            exit 0
          fi
          git commit -m "Publish ready EXTREME KIDS Growth OS 6.1"
          git push

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- HTTP ---'
          cat /tmp/growth61-http.log || true
          echo '--- Chrome ---'
          cat /tmp/growth61-chrome.log || true
          echo '--- DOM tail ---'
          tail -120 /tmp/growth61-dom.html || true
