name: Build Growth OS weekly attendance intelligence

on:
  push:
    branches: [main]
    paths:
      - growth6-source/attendance-patch-chunks/**
      - growth6-source/attendance_v1.js
      - growth6-source/attendance_v1.css
      - growth6-source/patch_attendance_v1.py
      - .github/workflows/build-growth62-attendance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-os-attendance-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build attendance release
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'growth6-source/attendance-patch-chunks/part*.txt' >/dev/null; then
            cat growth6-source/attendance-patch-chunks/part*.txt | base64 -d | tar -xz -C growth6-source
          fi
          python3 -m py_compile growth6-source/patch_attendance_v1.py
          python3 growth6-source/patch_attendance_v1.py
          python3 <<'PY'
          import re
          from pathlib import Path
          html = Path('growth-os/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('Application script missing')
          app = max(scripts, key=len)
          Path('/tmp/growth-attendance-app.js').write_text(app, encoding='utf-8')
          for marker in (
              "const VERSION='6.1.0'",
              "const BUILD='2026.08.31-payroll-team-readability'",
              'ATTENDANCE_INTELLIGENCE_V1_START',
              'function renderAttendance()',
              'function attendanceForecast(',
              'function attendanceReconcileTasks(',
              'МОЯ ЗАРПЛАТА ЗА МЕСЯЦ',
          ):
              if marker not in html:
                  raise SystemExit('Missing marker: ' + marker)
          PY
          node --check /tmp/growth-attendance-app.js

      - name: Browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory growth-os >/tmp/growth-attendance-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          key='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

          run_dom () {
            local name="$1"
            local hash="$2"
            timeout 55s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --virtual-time-budget=17000 --dump-dom "http://127.0.0.1:8765/#w=ek-attendance-${GITHUB_RUN_ID}&k=${key}&${hash}&t=release" >"/tmp/${name}.html" 2>"/tmp/${name}.log" || true
            grep -Fq '<div class="app-shell" id="appShell">' "/tmp/${name}.html"
            if grep -Fq 'id="bootText">Ошибка запуска' "/tmp/${name}.html"; then
              echo "Runtime boot failed for ${name}"
              exit 1
            fi
          }

          run_dom owner 'r=owner&v=attendance'
          grep -Fq '<h1 id="pageTitle">Посещаемость</h1>' /tmp/owner.html
          grep -Fq 'ЕЖЕНЕДЕЛЬНЫЙ КОНТРОЛЬ' /tmp/owner.html
          grep -Fq 'Заполненность групп' /tmp/owner.html
          grep -Fq 'Фактическая плотность' /tmp/owner.html
          grep -Fq 'Следующая неделя' /tmp/owner.html
          grep -Fq 'Отметить тренировку' /tmp/owner.html

          run_dom mentor 'r=mentor&p=ivan&v=attendance'
          grep -Fq '<h1 id="pageTitle">Посещаемость</h1>' /tmp/mentor.html
          grep -Fq 'Моя неделя' /tmp/mentor.html || grep -Fq 'Посещаемость и плотность' /tmp/mentor.html

          run_dom admin 'r=admin&p=anya&v=attendance'
          grep -Fq '<h1 id="pageTitle">Посещаемость</h1>' /tmp/admin.html
          grep -Fq 'Что требует внимания' /tmp/admin.html

          run_dom payroll 'r=owner&v=payroll'
          grep -Fq '<h1 id="pageTitle">ЗП и мотивация</h1>' /tmp/payroll.html
          grep -Fq 'Администраторы · автоматический расчёт' /tmp/payroll.html

      - name: Commit ready production site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch growth6-source/attendance-patch-chunks
          git add growth6-source/attendance_v1.js growth6-source/attendance_v1.css growth6-source/patch_attendance_v1.py growth6-source/v6.2.html growth6-source/SHA256.txt growth-os growth-os-6 growth61-live
          if git diff --cached --quiet; then
            echo 'Attendance release already current'
            exit 0
          fi
          git commit -m "Publish weekly attendance intelligence"
          git push

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo '--- HTTP ---'
          cat /tmp/growth-attendance-http.log || true
          for name in owner mentor admin payroll; do
            echo "--- ${name} chrome ---"
            cat "/tmp/${name}.log" 2>/dev/null || true
            echo "--- ${name} markers ---"
            grep -E 'pageTitle|bootText|Посещаемость|Фактическая плотность|ЗП и мотивация' "/tmp/${name}.html" 2>/dev/null | head -50 || true
            echo "--- ${name} tail ---"
            tail -80 "/tmp/${name}.html" 2>/dev/null || true
          done
