name: Final parent camp site

on:
  push:
    paths:
      - final-parent-site.trigger

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore proven premium parent site
        shell: bash
        run: |
          set -euo pipefail
          git show 737a203e11599434e71555ba59fa4a28419ffcec:index.html > index.html

      - name: Final corrections and verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, hashlib

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Typography/headline fixes.
          s=s.replace('ДНЕИ','ДНЕЙ').replace('5 ДНИ.','5 ДНЕЙ.').replace('5 ДНЕ.','5 ДНЕЙ.')

          # Parent-facing copy only: no technical photo/file language.
          for old in [
              'Нажмите на день. Меняется фотография наставника, настроение и акцент программы. Все фотографии загружаются отдельными исходными файлами без повторного сжатия.',
              'Нажмите на день — и увидите наставника, настроение и акцент программы. Вся неделя остаётся одной цельной историей.',
              'Нажмите на день. Фото наставника и программа меняются мягко, без перезагрузки страницы. Все фотографии загружаются в исходном высоком качестве.'
          ]:
              s=s.replace(old,'Выберите день — и посмотрите, кто будет рядом с детьми, какой спортивный акцент ждёт группу и как построена программа этого дня.')
          s=s.replace('Фото загружаются в HQ-качестве.','')
          s=re.sub(r'filecite[^]+','',s)

          # Identify the two original full-resolution mentor photos embedded in the proven build.
          m_ivan_old=re.search(r"\{name:'Ваня'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          m_stas_old=re.search(r"\{name:'Стас'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          assert m_ivan_old and m_stas_old
          glasses=m_ivan_old.group(1)      # user confirmed: this is Stas
          no_glasses=m_stas_old.group(1)   # user confirmed: this is Ivan

          def sha(uri):
              return hashlib.sha256(base64.b64decode(uri.split(',',1)[1])).hexdigest()
          assert sha(glasses)=='557cf39ddd7302ca0e1f6de4f9417d251ee37d1351126993b4d0d8ee847166cc'
          assert sha(no_glasses)=='2f3c7e0c749e7985741b5750c9dccfd9ae83831d5dbd2f31dafc07b9ff889680'

          # Monday = Ivan, no glasses. Tuesday = Stas, glasses.
          s=s.replace('<b>Ваня</b>','<b>Иван</b>',1)
          s=s.replace('<strong id="mentorName">Ваня</strong>','<strong id="mentorName">Иван</strong>',1)
          s=s.replace('<h3 id="mentorName">Ваня</h3>','<h3 id="mentorName">Иван</h3>',1)
          s=s.replace('alt="Ваня"','alt="Иван"',1)
          s=s.replace('Ролики с Ваней','Ролики с Иваном')
          s=s.replace("{name:'Ваня'","{name:'Иван'",1)

          # Initial image and the day-data images.
          s=s.replace('src="'+glasses+'" alt="Иван"','src="'+no_glasses+'" alt="Иван"',1)
          marker='__PHOTO_SWAP__'
          s=s.replace("img:'"+glasses+"'","img:'"+marker+"'",1)
          s=s.replace("img:'"+no_glasses+"'","img:'"+glasses+"'",1)
          s=s.replace("img:'"+marker+"'","img:'"+no_glasses+"'",1)

          # Build marker + animation fail-safe.
          if '<html lang="ru">' in s:
              s=s.replace('<html lang="ru">','<html lang="ru" data-build="parents-final-20260813">',1)
          s=s.replace('</body>',"<script>setTimeout(()=>document.querySelectorAll('.reveal').forEach(x=>x.classList.add('show')),1500)</script></body>",1)

          # Hard validation before publishing.
          assert len(s.encode('utf-8'))>2500000
          assert s.count('data:image/')>=7
          assert 'ДНЕИ' not in s
          assert '<b>Иван</b>' in s and '<b>Стас</b>' in s
          mi=re.search(r"\{name:'Иван'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          ms=re.search(r"\{name:'Стас'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          assert mi and ms
          assert sha(mi.group(1))=='2f3c7e0c749e7985741b5750c9dccfd9ae83831d5dbd2f31dafc07b9ff889680'
          assert sha(ms.group(1))=='557cf39ddd7302ca0e1f6de4f9417d251ee37d1351126993b4d0d8ee847166cc'

          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit final site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Publish final parent camp site'
          git push
