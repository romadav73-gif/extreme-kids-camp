name: Validate and deploy Growth OS 6.5 Sofia v4

on:
  push:
    branches: [main, feat/sofa-cabinet-v4]
    paths:
      - "growth-os/index.html"
      - "growth-os/sofa-cabinet-v4.patch.js"
      - "growth-os/sofa-cabinet-v4.1.patch.js"
      - ".github/workflows/deploy-growth65-sofa-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth65-sofa-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_URL: https://extreme-kids-roller-control-v6.vercel.app
      PROJECT_NAME: extreme-kids-roller-control-v6
      DEFAULT_PROJECT_ID: prj_ZK7LWYYXFITMVj2A70McmSzCSupF
      DEFAULT_TEAM_ID: team_NfdY7suD4zbSAcH4V65X2zDP
    steps:
      - uses: actions/checkout@v4

      - name: Build patched Growth OS 6.5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          base=Path('growth-os/index.html').read_text(encoding='utf-8')
          patch=Path('growth-os/sofa-cabinet-v4.patch.js').read_text(encoding='utf-8')
          patch_fix=Path('growth-os/sofa-cabinet-v4.1.patch.js').read_text(encoding='utf-8')
          marker="document.addEventListener('click',handleClick);"
          assert base.count(marker)==1, base.count(marker)
          assert 'SOFA65_FINISH_V2_START' in base
          assert 'SOFA65_CORRECTIONS_V3_START' in base
          assert 'SOFA65_CLEANUP_V4_START' in patch
          assert 'SOFA65_CLEANUP_V4_1_START' in patch_fix
          html=base.replace(marker,patch+'\n'+patch_fix+'\n'+marker)
          Path('/tmp/index.html').write_text(html,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html,flags=re.I)
          Path('/tmp/growth65-v4.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('patched bytes',len(html.encode('utf-8')))
          PY
          node --check /tmp/growth65-v4.js

      - name: Browser QA Sofia cabinet
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory /tmp >/tmp/sofa-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          base='http://127.0.0.1:8765/index.html'
          key="qa-key-${GITHUB_RUN_ID}"
          flags=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --disable-sync --disable-default-apps --disable-extensions --no-first-run --metrics-recording-only --virtual-time-budget=8000 --window-size=1440,1200)

          clean_visible () {
            python - "$1" "$2" <<'PY'
          import re,sys
          s=open(sys.argv[1],encoding='utf-8').read()
          s=re.sub(r'<script\b[^>]*>[\s\S]*?</script>','',s,flags=re.I)
          s=re.sub(r'<style\b[^>]*>[\s\S]*?</style>','',s,flags=re.I)
          open(sys.argv[2],'w',encoding='utf-8').write(s)
          PY
          }
          run_dom () {
            name="$1"; role="$2"; view="$3"
            workspace="ek65-v4-${GITHUB_RUN_ID}-${name}"
            timeout 90s "$chrome" "${flags[@]}" --dump-dom "${base}#w=${workspace}&k=${key}&r=${role}&v=${view}&t=${GITHUB_RUN_ID}-${name}" >"/tmp/${name}.html" 2>"/tmp/${name}.log" || true
            clean_visible "/tmp/${name}.html" "/tmp/${name}.visible.html"
            if ! grep -Fq '<div class="app-shell" id="appShell">' "/tmp/${name}.visible.html"; then
              echo "FAIL ${name}: app shell did not boot"; grep -o 'id="bootText"[^>]*>[^<]*' "/tmp/${name}.visible.html" || true; tail -80 "/tmp/${name}.log"; exit 1
            fi
            if grep -Fq 'id="bootText">Ошибка запуска' "/tmp/${name}.visible.html"; then
              echo "FAIL ${name}: boot error"; grep -o 'id="bootText"[^>]*>[^<]*' "/tmp/${name}.visible.html" || true; tail -80 "/tmp/${name}.log"; exit 1
            fi
          }
          must () { file="$1"; text="$2"; label="$3"; if ! grep -Fq "$text" "$file"; then echo "FAIL: $label"; echo 'page title:'; grep -o '<h1 id="pageTitle">[^<]*</h1>' "$file" || true; echo 'sync attr:'; grep -o 'data-sofa-sync-selftest="[^"]*"' "$file" || true; exit 1; fi; }
          must_not () { file="$1"; text="$2"; label="$3"; if grep -Fq "$text" "$file"; then echo "FAIL: $label ($text)"; exit 1; fi; }

          echo 'QA manager home'
          run_dom manager_home manager manager
          must /tmp/manager_home.visible.html '<h1 id="pageTitle">Главная Софы</h1>' 'manager title'
          must /tmp/manager_home.html 'data-sofa-sync-selftest="ok"' 'field-safe merge selftest'
          must /tmp/manager_home.visible.html 'Три результата сегодня' 'home results block'
          must /tmp/manager_home.visible.html 'общая база' 'shared-base indicator'
          for x in 'Собрание УП' 'ЗП и мотивация' 'Аналитика и прогноз' 'Учебный год' 'План развития'; do must_not /tmp/manager_home.visible.html "$x" 'duplicate Sofia navigation'; done

          echo 'QA daily control'
          run_dom manager_control manager operations
          must /tmp/manager_control.visible.html 'Операционный день' 'operations page'
          must /tmp/manager_control.visible.html 'Три результата дня' 'daily priorities'
          must /tmp/manager_control.visible.html 'Что дальше' 'next-control block'
          must_not /tmp/manager_control.visible.html '>Итог дня<' 'legacy daily report'
          must_not /tmp/manager_control.visible.html 'Отчёт Роману' 'legacy report to Roman'
          must_not /tmp/manager_control.visible.html 'Цифры дня' 'duplicate daily metrics tab'

          echo 'QA numbers'
          run_dom manager_numbers manager sofa_numbers
          must /tmp/manager_numbers.visible.html '<h1 id="pageTitle">Цифры клуба</h1>' 'numbers title'
          must /tmp/manager_numbers.visible.html '8 полей' 'numbers compact input set'

          echo 'QA meetings'
          run_dom manager_meetings manager sofa_meetings
          must /tmp/manager_meetings.visible.html '<h1 id="pageTitle">Собрания</h1>' 'meetings title'
          must /tmp/manager_meetings.html 'id="sofa3MeetingForm"' 'meeting form'

          echo 'QA motivation permissions'
          run_dom manager_motivation manager sofa_motivation
          must /tmp/manager_motivation.visible.html '<h1 id="pageTitle">Мотивация Софы</h1>' 'motivation title'
          must_not /tmp/manager_motivation.visible.html 'data-action="sofa3ToggleKpi"' 'Sofia must not edit her KPI'
          must_not /tmp/manager_motivation.visible.html 'data-action="sofa3LockSalary"' 'Sofia must not lock salary'

          echo 'QA system'
          run_dom manager_system manager sofa_system
          must /tmp/manager_system.visible.html '<h1 id="pageTitle">Система управляющей</h1>' 'system title'
          must /tmp/manager_system.visible.html 'Что делать, если' 'decision playbooks'
          must /tmp/manager_system.visible.html 'Травма / угроза безопасности' 'injury playbook'
          must /tmp/manager_system.visible.html 'Расхождение кассы / денег' 'cash playbook'

          echo 'QA shared pages and stale routes'
          run_dom manager_tasks manager tasks
          run_dom manager_groups manager groups
          must /tmp/manager_groups.visible.html 'Группы' 'groups access'
          run_dom manager_hidden_analytics manager analytics
          must /tmp/manager_hidden_analytics.visible.html '<h1 id="pageTitle">Главная Софы</h1>' 'hidden analytics fallback'

          echo 'QA owner controls'
          run_dom owner_motivation owner sofa_motivation
          must /tmp/owner_motivation.visible.html 'data-action="sofa3ToggleKpi"' 'owner KPI control'
          must /tmp/owner_motivation.visible.html 'data-action="sofa3LockSalary"' 'owner salary lock'
          echo 'SOFA_V4_BROWSER_QA_OK'

      - name: Prepare Vercel bundle
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vercel.json <<'JSON'
          {"headers":[{"source":"/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"},{"key":"X-Robots-Tag","value":"noindex, nofollow"},{"key":"Referrer-Policy","value":"no-referrer"}]}]}
          JSON

      - name: Resolve Vercel credentials
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
          PROJECT_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
          TEAM_SECRET: ${{ secrets.VERCEL_TEAM_ID }}
          ORG_SECRET: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_PRIMARY:-${TOKEN_ACCESS:-${TOKEN_API:-}}}"
          test -n "$TOKEN" || { echo '::error::Vercel token is not configured'; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_TEAM_ID=${TEAM_SECRET:-${ORG_SECRET:-$DEFAULT_TEAM_ID}}" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${PROJECT_SECRET:-$DEFAULT_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Deploy Sofia v4 to production
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,json,os
          def f(path,name): return {'file':name,'data':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'}
          payload={'name':os.environ['PROJECT_NAME'],'project':os.environ['VERCEL_PROJECT_ID'],'target':'production','files':[f('/tmp/index.html','index.html'),f('/tmp/vercel.json','vercel.json')],'meta':{'release':'growth-os-6.5-sofia-v4','githubSha':os.environ.get('GITHUB_SHA','')},'projectSettings':{'framework':None,'skipGitConnectDuringLink':True}}
          Path('/tmp/payload.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
          PY
          endpoint="https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1&teamId=${VERCEL_TEAM_ID}"
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$endpoint" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json)
          [[ "$code" =~ ^2 ]] || { cat /tmp/deploy.json; exit 1; }
          id=$(python -c "import json;print(json.load(open('/tmp/deploy.json')).get('id',''))")
          test -n "$id"
          for attempt in $(seq 1 72); do
            curl -sS "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -o /tmp/status.json
            status=$(python -c "import json;d=json.load(open('/tmp/status.json'));print(d.get('readyState') or d.get('status') or d.get('state') or 'UNKNOWN')")
            echo "deployment: $status"
            [ "$status" = READY ] && exit 0
            case "$status" in ERROR|CANCELED|CANCELLED) cat /tmp/status.json; exit 1;; esac
            sleep 5
          done
          exit 1

      - name: Verify stable production and cloud sync roundtrip
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 60); do
            if curl -sSfL -H 'Cache-Control: no-cache' "${PROD_URL}/?release=${GITHUB_SHA}-${attempt}" -o /tmp/prod.html && grep -Fq 'SOFA65_CLEANUP_V4_START' /tmp/prod.html && grep -Fq 'SOFA65_CLEANUP_V4_1_START' /tmp/prod.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          key="prod-qa-key-${GITHUB_RUN_ID}"
          timeout 150s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-sync --disable-extensions --no-first-run --virtual-time-budget=16000 --dump-dom "${PROD_URL}/?qa=${GITHUB_SHA}#w=ek65-prod-v4-${GITHUB_RUN_ID}&k=${key}&r=manager&v=manager&t=prod-${GITHUB_RUN_ID}&qaSync=1" >/tmp/prod-dom.html 2>/tmp/prod-chrome.log || true
          grep -Fq 'data-sofa-sync-selftest="ok"' /tmp/prod-dom.html || { echo 'field merge selftest failed'; tail -100 /tmp/prod-chrome.log; exit 1; }
          grep -Fq 'data-sofa-cloud-selftest="ok"' /tmp/prod-dom.html || { echo 'cloud roundtrip failed'; tail -100 /tmp/prod-chrome.log; exit 1; }
          grep -Fq '<h1 id="pageTitle">Главная Софы</h1>' /tmp/prod-dom.html
          echo 'SOFA_V4_PRODUCTION_QA_OK'
