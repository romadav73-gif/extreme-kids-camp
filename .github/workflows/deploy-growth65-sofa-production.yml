name: Validate and optionally deploy Growth OS 6.5 Sofia v4

on:
  push:
    branches: [main, feat/sofa-cabinet-v4]
    paths:
      - "growth-os/index.html"
      - "growth-os/sofa-cabinet-v4.patch.js"
      - "growth-os/sofa-cabinet-v4.1.patch.js"
      - ".github/workflows/deploy-growth65-sofa-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth65-sofa-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROD_URL: https://extreme-kids-roller-control-v6.vercel.app
      PROJECT_NAME: extreme-kids-roller-control-v6
      DEFAULT_PROJECT_ID: prj_ZK7LWYYXFITMVj2A70McmSzCSupF
      DEFAULT_TEAM_ID: team_NfdY7suD4zbSAcH4V65X2zDP

    steps:
      - uses: actions/checkout@v4

      - name: Build patched Growth OS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          base=Path('growth-os/index.html').read_text(encoding='utf-8')
          p4=Path('growth-os/sofa-cabinet-v4.patch.js').read_text(encoding='utf-8')
          p41=Path('growth-os/sofa-cabinet-v4.1.patch.js').read_text(encoding='utf-8')
          marker="document.addEventListener('click',handleClick);"
          assert base.count(marker)==1
          assert 'SOFA65_FINISH_V2_START' in base
          assert 'SOFA65_CORRECTIONS_V3_START' in base
          assert 'SOFA65_CLEANUP_V4_START' in p4
          assert 'SOFA65_CLEANUP_V4_1_START' in p41
          html=base.replace(marker,p4+'\n'+p41+'\n'+marker)
          Path('/tmp/index.html').write_text(html,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',html,flags=re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Browser QA Sofia cabinet
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory /tmp >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          sleep 1
          base='http://127.0.0.1:8765/index.html'
          key="qa-${GITHUB_RUN_ID}-growth65-sofa-v4"
          flags=(--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --disable-sync --disable-extensions --no-first-run --virtual-time-budget=8000 --window-size=1440,1200)

          run_page () {
            name="$1"; role="$2"; view="$3"
            timeout 90s "$chrome" "${flags[@]}" --dump-dom "${base}#w=ek65-${GITHUB_RUN_ID}-${name}&k=${key}&r=${role}&v=${view}&t=${GITHUB_RUN_ID}-${name}" >"/tmp/${name}.html" 2>"/tmp/${name}.log" || true
            grep -Fq '<div class="app-shell" id="appShell">' "/tmp/${name}.html" || { echo "App failed to boot: ${name}"; tail -80 "/tmp/${name}.log"; exit 1; }
            ! grep -Fq 'id="bootText">Ошибка запуска' "/tmp/${name}.html" || { echo "Boot error: ${name}"; exit 1; }
          }
          must () { grep -Fq "$2" "$1" || { echo "Missing '$2' in $1"; exit 1; }; }
          must_not () { ! grep -Fq "$2" "$1" || { echo "Unexpected '$2' in $1"; exit 1; }; }

          run_page home manager manager
          must /tmp/home.html '<h1 id="pageTitle">Главная Софы</h1>'
          must /tmp/home.html 'Три результата сегодня'
          must /tmp/home.html 'data-sofa-sync-selftest="ok"'
          for x in 'Собрание УП' 'ЗП и мотивация' 'Аналитика и прогноз' 'Учебный год' 'План развития'; do must_not /tmp/home.html "$x"; done

          run_page control manager operations
          must /tmp/control.html '<h1 id="pageTitle">Контроль дня</h1>'
          must /tmp/control.html 'Три результата дня'
          must /tmp/control.html 'Что дальше'
          must_not /tmp/control.html 'Отчёт Роману'
          must_not /tmp/control.html '>Итог дня<'
          must_not /tmp/control.html 'Цифры дня'

          run_page numbers manager sofa_numbers
          must /tmp/numbers.html '<h1 id="pageTitle">Цифры клуба</h1>'
          must /tmp/numbers.html '8 полей'

          run_page meetings manager sofa_meetings
          must /tmp/meetings.html '<h1 id="pageTitle">Собрания</h1>'
          must /tmp/meetings.html 'id="sofa3MeetingForm"'

          run_page motivation manager sofa_motivation
          must /tmp/motivation.html '<h1 id="pageTitle">Мотивация Софы</h1>'
          must_not /tmp/motivation.html 'data-action="sofa3ToggleKpi"'
          must_not /tmp/motivation.html 'data-action="sofa3LockSalary"'

          run_page system manager sofa_system
          must /tmp/system.html '<h1 id="pageTitle">Система управляющей</h1>'
          must /tmp/system.html 'Что делать, если'
          must /tmp/system.html 'Травма / угроза безопасности'
          must /tmp/system.html 'Расхождение кассы / денег'

          run_page tasks manager tasks
          run_page groups manager groups
          must /tmp/groups.html 'Группы'

          run_page stale_analytics manager analytics
          must /tmp/stale_analytics.html '<h1 id="pageTitle">Главная Софы</h1>'
          run_page stale_payroll manager payroll
          must /tmp/stale_payroll.html '<h1 id="pageTitle">Мотивация Софы</h1>'
          run_page stale_meeting manager meeting
          must /tmp/stale_meeting.html '<h1 id="pageTitle">Собрания</h1>'

          run_page owner_motivation owner sofa_motivation
          must /tmp/owner_motivation.html 'data-action="sofa3ToggleKpi"'
          must /tmp/owner_motivation.html 'data-action="sofa3LockSalary"'
          echo SOFA_V4_BROWSER_QA_OK

      - name: Prepare Vercel files
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cat > /tmp/vercel.json <<'JSON'
          {"headers":[{"source":"/(.*)","headers":[{"key":"Cache-Control","value":"public, max-age=0, must-revalidate"},{"key":"X-Robots-Tag","value":"noindex, nofollow"},{"key":"Referrer-Policy","value":"no-referrer"}]}]}
          JSON

      - name: Check Vercel credentials
        id: vercel
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
          TOKEN_ACCESS: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
          PROJECT_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
          TEAM_SECRET: ${{ secrets.VERCEL_TEAM_ID }}
          ORG_SECRET: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_PRIMARY:-${TOKEN_ACCESS:-${TOKEN_API:-}}}"
          if [ -z "$TOKEN" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Vercel credentials are not stored in GitHub; validation passed and deployment is skipped.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "VERCEL_TEAM_ID=${TEAM_SECRET:-${ORG_SECRET:-$DEFAULT_TEAM_ID}}" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=${PROJECT_SECRET:-$DEFAULT_PROJECT_ID}" >> "$GITHUB_ENV"

      - name: Deploy to Vercel production
        if: github.ref == 'refs/heads/main' && steps.vercel.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,json,os
          def f(path,name): return {'file':name,'data':base64.b64encode(Path(path).read_bytes()).decode(),'encoding':'base64'}
          payload={'name':os.environ['PROJECT_NAME'],'project':os.environ['VERCEL_PROJECT_ID'],'target':'production','files':[f('/tmp/index.html','index.html'),f('/tmp/vercel.json','vercel.json')],'meta':{'release':'growth-os-6.5-sofia-v4','githubSha':os.environ.get('GITHUB_SHA','')},'projectSettings':{'framework':None,'skipGitConnectDuringLink':True}}
          Path('/tmp/payload.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
          PY
          endpoint="https://api.vercel.com/v13/deployments?forceNew=1&skipAutoDetectionConfirmation=1&teamId=${VERCEL_TEAM_ID}"
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$endpoint" -H "Authorization: Bearer ${VERCEL_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json)
          [[ "$code" =~ ^2 ]] || { cat /tmp/deploy.json; exit 1; }
          id=$(python -c "import json;print(json.load(open('/tmp/deploy.json')).get('id',''))")
          test -n "$id"
          for attempt in $(seq 1 72); do
            curl -sS "https://api.vercel.com/v13/deployments/${id}?teamId=${VERCEL_TEAM_ID}" -H "Authorization: Bearer ${VERCEL_TOKEN}" -o /tmp/status.json
            status=$(python -c "import json;d=json.load(open('/tmp/status.json'));print(d.get('readyState') or d.get('status') or d.get('state') or 'UNKNOWN')")
            [ "$status" = READY ] && exit 0
            case "$status" in ERROR|CANCELED|CANCELLED) cat /tmp/status.json; exit 1;; esac
            sleep 5
          done
          exit 1

      - name: Verify deployed production
        if: github.ref == 'refs/heads/main' && steps.vercel.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -sSfL -H 'Cache-Control: no-cache' "${PROD_URL}/?release=${GITHUB_SHA}-${attempt}" -o /tmp/prod.html && grep -Fq 'SOFA65_CLEANUP_V4_START' /tmp/prod.html; then
              echo SOFA_V4_PRODUCTION_SOURCE_OK
              exit 0
            fi
            sleep 5
          done
          exit 1
