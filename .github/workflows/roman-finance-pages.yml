name: Deploy Roman Finance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/roman-finance-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roman-finance-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Roman Finance source
        uses: actions/checkout@v4
        with:
          ref: roman-finance-v5-working
      - name: Build self-contained site
        run: |
          mkdir -p _site
          cat roman-finance/chunk{1..6}.txt | base64 -d | gzip -d > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'Roman Finance' _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record deployment result
        if: always()
        env:
          RESULT: ${{ job.status }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '%s\n%s\n%s\n' "$RESULT" "$PAGE_URL" "$(date -u +%FT%TZ)" > roman-finance/pages-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roman-finance/pages-status.txt
          git commit -m "Record Roman Finance Pages deployment: $RESULT" || exit 0
          git push origin HEAD:roman-finance-v5-working
