name: Event finance final verified workflows
on:
  push:
    branches: [feature/events-finance-20261008]
    paths: ['.github/workflows/event-finance-final-qa.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright==1.55.0 pyyaml
      - name: Prepare synthetic service and native-input disabled assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          steps=yaml.safe_load(Path('.github/workflows/event-finance-published.yml').read_text())['jobs']['verify']['steps']
          Path('/tmp/event-prepare.sh').write_text(next(s['run'] for s in steps if s.get('name','').startswith('Synthetic authenticated')))
          Path('/tmp/event-health.sh').write_text(next(s['run'] for s in steps if s.get('name','').startswith('Deployed edge')))
          p=Path('event-finance/browser.py');s=p.read_text()
          old="p.locator('#efForm fieldset').is_disabled()"
          assert s.count(old)==1
          s=s.replace(old,"p.locator('#efForm [data-ef-field=fact][data-section=expenses]').is_disabled()")
          p.write_text(s)
          PY
          bash -e /tmp/event-prepare.sh
      - name: Complete published event workflows on isolated accounts
        run: python event-finance/browser.py
      - name: Real edge health and anonymous denial only
        if: always()
        run: bash -e /tmp/event-health.sh
      - name: Commit corrected browser assertion after successful run
        run: |
          git config user.name 'EXTREME KIDS validation'
          git config user.email 'actions@users.noreply.github.com'
          git add event-finance/browser.py
          git commit -m 'Check effective disabled state on editable expense input; all event workflows verified'
          git push origin HEAD:feature/events-finance-20261008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-finance-final-evidence
          path: evidence/
          retention-days: 7
