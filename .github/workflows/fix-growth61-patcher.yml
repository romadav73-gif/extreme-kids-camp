name: Fix Growth OS 6.1 patcher replacement escaping

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-growth61-patcher.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix replacement function
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('growth6-source/patch_v61.py')
          s=p.read_text(encoding='utf-8')
          old='text2, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new='text2, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=flags)'
          if old not in s: raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6-source/patch_v61.py
          git commit -m "Fix Growth OS 6.1 patch replacement escaping"
          git push
