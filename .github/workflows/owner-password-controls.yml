name: Owner password controls isolated verification
on:
  push:
    branches: [fix/owner-password-controls]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4bfae20bce0cd0bfd873a2db08734ece399457ff
          path: previous
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          ln -s previous/secure-growth65 base
          cd base && node scripts/build.cjs
      - run: pip install playwright==1.55.0
      - name: Exercise actual owner reset form and isolated account lifecycle
        run: |
          node --check owner-password.mjs
          node --check owner-passwords.js
          node local-server.mjs > local-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8879/login >/dev/null && break || sleep 1; done
          python browser-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-password-controls-evidence
          path: |
            browser-results.json
            password-reset-mobile.png
            password-reset-desktop.png
          retention-days: 7
