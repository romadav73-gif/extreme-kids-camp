name: Build Growth OS management system

on:
  push:
    branches: [main]
    paths:
      - growth6-source/team_access_v1.js
      - growth6-source/team_access_v1.css
      - growth6-source/group_access_v1.js
      - growth6-source/management_up_v1.js
      - growth6-source/management_up_v1.css
      - growth6-source/sofa3_merge_v1.js
      - growth6-source/sofa3_merge_v1.css
      - growth6-source/patch_team_access_v1.py
      - .github/workflows/build-growth63-role-cabinets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-os-management-release
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Growth OS 6.5
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile growth6-source/patch_team_access_v1.py
          python3 growth6-source/patch_team_access_v1.py
          python3 <<'PY'
          import json,re
          from pathlib import Path
          html=Path('growth-os/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts: raise SystemExit('Application script missing')
          Path('/tmp/growth-management-app.js').write_text(max(scripts,key=len),encoding='utf-8')
          meta=json.loads(Path('growth-os/BUILD.json').read_text(encoding='utf-8'))
          if meta.get('featureVersion')!='6.5-sofa-operations': raise SystemExit('Wrong feature version: '+str(meta))
          for marker in (
            "const VERSION='6.1.0'",
            'ATTENDANCE_INTELLIGENCE_V1_START',
            'TEAM_CABINETS_ACCESS_V1_START',
            'MANAGEMENT_GROUP_ACCESS_V1_START',
            'MANAGEMENT_UP_V1_START',
            'SOFA3_UNIQUE_MERGE_V1_START',
            'function canSeeAllTasks()',
            'function canSeeAllGroups()',
            'function isManagementBoard()',
            "label:'Документы и обязанности'",
            "label:'Собрание УП'",
            "label:'Операционный день'",
            'function renderDocumentsAndDuties()',
            'function renderMeeting()',
            'function renderOperations()',
            'const SOFA3_BASE_SALARY=100000',
            'СОФА · МОТИВАЦИЯ УПРАВЛЯЮЩЕЙ',
            'МОЯ ЗАРПЛАТА ЗА МЕСЯЦ',
          ):
            if marker not in html: raise SystemExit('Missing marker: '+marker)
          PY
          node --check /tmp/growth-management-app.js

      - name: Browser permission and feature smoke tests
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory growth-os >/tmp/growth-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          key='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          run_dom(){
            local name="$1";local hash="$2"
            timeout 60s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:8765/#w=ek-main-${GITHUB_RUN_ID}-${name}&k=${key}&${hash}&t=release" >"/tmp/${name}.html" 2>"/tmp/${name}.log" || true
            grep -Fq '<div class="app-shell" id="appShell">' "/tmp/${name}.html"
            if grep -Fq 'id="bootText">Ошибка запуска' "/tmp/${name}.html";then echo "Runtime boot failed ${name}";exit 1;fi
          }

          run_dom owner_ops 'r=owner&v=operations'
          grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/owner_ops.html
          grep -Fq 'ОПЕРАЦИОННЫЙ ЦЕНТР' /tmp/owner_ops.html
          grep -Fq 'Три результата дня' /tmp/owner_ops.html

          run_dom manager_ops 'r=manager&v=operations'
          grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/manager_ops.html
          grep -Fq 'Мотивация Софы' /tmp/manager_ops.html

          run_dom tasya_ops 'r=mentor&p=tasya&v=operations'
          if grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/tasya_ops.html;then echo 'Ordinary mentor can access operations';exit 1;fi

          run_dom owner_tasks 'r=owner&v=tasks'
          grep -Fq 'Все ответственные' /tmp/owner_tasks.html
          run_dom manager_tasks 'r=manager&v=tasks'
          grep -Fq 'Все ответственные' /tmp/manager_tasks.html
          run_dom stas_tasks 'r=stas&v=tasks'
          grep -Fq 'Все ответственные' /tmp/stas_tasks.html
          run_dom ivan_tasks 'r=mentor&p=ivan&v=tasks'
          grep -Fq 'Все ответственные' /tmp/ivan_tasks.html
          run_dom tasya_tasks 'r=mentor&p=tasya&v=tasks'
          grep -Fq 'только мои' /tmp/tasya_tasks.html
          if grep -Fq '<h4>Подготовить «Арбузные зарубы»</h4>' /tmp/tasya_tasks.html;then echo 'Task privacy regression';exit 1;fi

          run_dom owner_groups 'r=owner&v=groups'
          grep -Fq 'Роман видит все активные группы клуба' /tmp/owner_groups.html
          run_dom ivan_groups 'r=mentor&p=ivan&v=groups'
          grep -Fq 'Иван видит все активные группы клуба' /tmp/ivan_groups.html
          run_dom tasya_groups 'r=mentor&p=tasya&v=groups'
          if grep -Fq '<td>Денис</td>' /tmp/tasya_groups.html;then echo 'Group privacy regression';exit 1;fi

          run_dom owner_docs 'r=owner&v=documents'
          grep -Fq 'Управляющий режим' /tmp/owner_docs.html
          run_dom tasya_docs 'r=mentor&p=tasya&v=documents'
          grep -Fq 'Режим только для чтения' /tmp/tasya_docs.html

          run_dom owner_meeting 'r=owner&v=meeting'
          grep -Fq '<h1 id="pageTitle">Собрание УП</h1>' /tmp/owner_meeting.html
          grep -Fq 'Роман + Софа' /tmp/owner_meeting.html
          grep -Fq 'Собрание администраторов' /tmp/owner_meeting.html
          grep -Fq 'Воронка продаж' /tmp/owner_meeting.html
          grep -Fq 'Качество и дисциплина' /tmp/owner_meeting.html
          grep -Fq 'Закрытие месяца' /tmp/owner_meeting.html
          grep -Fq 'Сохранить встречу и создать задачи' /tmp/owner_meeting.html
          grep -Fq 'id="meetingTimerValue"' /tmp/owner_meeting.html

          run_dom tasya_meeting 'r=mentor&p=tasya&v=meeting'
          if grep -Fq '<h1 id="pageTitle">Собрание УП</h1>' /tmp/tasya_meeting.html;then echo 'Meeting privacy regression';exit 1;fi

          run_dom payroll 'r=owner&v=payroll'
          grep -Fq '<h1 id="pageTitle">ЗП и мотивация</h1>' /tmp/payroll.html
          grep -Fq 'СОФА · МОТИВАЦИЯ УПРАВЛЯЮЩЕЙ' /tmp/payroll.html
          grep -Fq 'Администраторы · автоматический расчёт' /tmp/payroll.html

          run_dom attendance 'r=owner&v=attendance'
          grep -Fq '<h1 id="pageTitle">Посещаемость</h1>' /tmp/attendance.html
          grep -Fq 'Фактическая плотность' /tmp/attendance.html

      - name: Commit ready release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6-source/team_access_v1.js growth6-source/team_access_v1.css growth6-source/group_access_v1.js growth6-source/management_up_v1.js growth6-source/management_up_v1.css growth6-source/sofa3_merge_v1.js growth6-source/sofa3_merge_v1.css growth6-source/patch_team_access_v1.py growth6-source/v6.5.html growth6-source/SHA256.txt growth-os growth-os-6 growth61-live
          if git diff --cached --quiet;then echo 'Growth OS 6.5 release already current';exit 0;fi
          git commit -m "Publish Growth OS 6.5 unified management system"
          git push

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/growth-http.log 2>/dev/null || true
          for name in owner_ops manager_ops tasya_ops owner_tasks manager_tasks stas_tasks ivan_tasks tasya_tasks owner_groups ivan_groups tasya_groups owner_docs tasya_docs owner_meeting tasya_meeting payroll attendance;do
            echo "--- ${name} ---";cat "/tmp/${name}.log" 2>/dev/null | tail -30 || true
            grep -E 'pageTitle|bootText|Операционный|Собрание|СОФА|Фактическая плотность|Все ответственные|только мои' "/tmp/${name}.html" 2>/dev/null | head -60 || true
          done
