name: Seed EXTREME KIDS Management 4 workspace

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seed-management4.yml'

permissions:
  contents: write

concurrency:
  group: seed-management4
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create protected workspace
        shell: bash
        env:
          NS: ek4-839c74b9b196fd44d077691fc673c573
          RECORD_B64: 
        run: |
          set -euo pipefail
          cat > public.pem <<'PEM'
-----BEGIN PUBLIC KEY-----
MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyebKFy4nhsqNiVtzXY8K
H6mfggOW3ugGlGLF374cgR1GjdkBiPKp9xxLiNcA/NwSIkcGz14bN/EeDw+ghgAf
vPlaV/5sVwe4IZX90rhY76Q66w0ZVeXG5h0dRvmRs/UdsUn7HExpC45BMKxq0CTH
8bSzklx8skUv+g3WRpJJr/5RGHqLzQEwJ7dGadMIVzvCwnGDP8yfeeVMr9VL/DxW
mn9HlXOvqVPsPWJwjjw9BsCH9PyV0+PImV+sC71AkPuPOEGAycRMS05Qo1FzDxQV
jdQBOIXnoxOPfXKeL+aurQ0OZPLBV5hS78S+1Dkzgy8nTKLVC7O6Mf1mdeM6F9Bj
NQIDAQAB
-----END PUBLIC KEY-----
PEM
          printf '%s' "$RECORD_B64" | base64 -d > record.json
          claim="$(curl --retry 3 --retry-delay 2 -fsS "https://mantledb.sh/v2/claim/$NS")"
          key="$(printf '%s' "$claim" | jq -r '.key // empty')"
          test -n "$key"
          curl --retry 3 --retry-delay 2 -fsS -X POST "https://mantledb.sh/v2/$NS/workspace" \
            -H 'Content-Type: application/json' \
            -H "X-Mantle-Key: $key" \
            --data-binary @record.json >/dev/null
          verify="$(curl --retry 3 --retry-delay 2 -fsS "https://mantledb.sh/v2/$NS/workspace" -H "X-Mantle-Key: $key")"
          test "$(printf '%s' "$verify" | jq -r '.revision')" = '1'
          printf '%s' "$key" | openssl pkeyutl -encrypt -pubin -inkey public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            | base64 -w0 > sealed.txt
          {
            echo "NS=$NS"
            echo "SEALED=$(cat sealed.txt)"
          } > management4/seed-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add management4/seed-result.txt
          git commit -m 'Record encrypted Management 4 workspace key'
          git push
