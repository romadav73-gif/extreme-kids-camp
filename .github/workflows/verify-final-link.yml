name: Verify Growth OS 6.5 Vercel preview
on:
  push:
    branches: [growth65-sofa3-merge]
    paths:
      - '.github/workflows/verify-final-link.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Render Vercel preview with Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          URL='https://extreme-kids-roller-control-v6-36hmerl2r.vercel.app/#w=ek-delivery-check&k=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef&r=owner&v=operations&t=verify'
          timeout 150s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --disable-sync --disable-default-apps --disable-extensions --no-first-run --virtual-time-budget=22000 --dump-dom "$URL" >/tmp/site.html 2>/tmp/chrome.log || true
          grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/site.html
          grep -Fq 'ОПЕРАЦИОННЫЙ ЦЕНТР' /tmp/site.html
          grep -Fq 'Три результата дня' /tmp/site.html
          grep -Fq 'Growth OS <span>6.5</span>' /tmp/site.html
          if grep -Fq 'Не удалось загрузить Growth OS' /tmp/site.html; then cat /tmp/chrome.log; exit 1; fi
          echo 'VERIFY_OK Growth OS 6.5 rendered through Vercel preview'
