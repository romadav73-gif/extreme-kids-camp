name: Growth 6.5 candidate regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth65-candidate-regression.yml'
      - '.github/scripts/growth65-regression.cjs'
      - 'growth-os/audit65-fixes.patch.js'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: growth65-candidate-regression
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_MODE: candidate
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - run: node --check growth-os/audit65-fixes.patch.js && node .github/scripts/growth65-regression.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth65-candidate-${{ github.run_id }}
          path: audit-output/
          retention-days: 14
