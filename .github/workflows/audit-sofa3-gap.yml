name: Audit Sofa 3.0 gap

on:
  push:
    branches: [audit-sofa3-merge]
    paths:
      - .github/workflows/audit-sofa3-gap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build functional gap report
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re, subprocess, json
          from pathlib import Path

          repo = Path('.')
          sofa_commit = '32408ad6b5c6c0af052167a180ebd7fcc8ccd121'
          parts=[]
          for i in range(17):
              path=f'management-v6/parts/p{i:02d}.txt'
              parts.append(subprocess.check_output(['git','show',f'{sofa_commit}:{path}'], text=True))
          sofa=''.join(parts)
          growth=Path('growth-os/index.html').read_text(encoding='utf-8')

          def funcs(text):
              return sorted(set(re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', text)))
          sf, gf = funcs(sofa), funcs(growth)
          unique=[x for x in sf if x not in gf]

          def navs(text):
              out=[]
              for m in re.finditer(r"\{\s*(?:id|page)\s*:\s*['\"]([^'\"]+)['\"][^{}]{0,240}?(?:label|title|name)\s*:\s*['\"]([^'\"]+)['\"]", text, re.S):
                  out.append((m.group(1),m.group(2)))
              for m in re.finditer(r"data-page=['\"]([^'\"]+)['\"][^>]*>([^<]{1,80})<", text, re.S):
                  out.append((m.group(1),re.sub(r'\s+',' ',m.group(2)).strip()))
              seen=[]
              for x in out:
                  if x not in seen: seen.append(x)
              return seen

          keywords=[
            'today','report','sales','funnel','lead','trial','renew','client','quality','complaint','incident','audit',
            'cash','finance','debt','expense','revenue','plan','fact','shift','payroll','salary','motivation',
            'meeting','document','duty','role','checklist','opening','closing','discipline','review','feedback',
            'inventory','stock','equipment','clean','safety','conversion','crm','call','message','parent','service',
            'employee','mentor','admin','manager','schedule','attendance','calendar','task','goal','event','camp'
          ]

          def snippets(text, word, limit=5, radius=180):
              res=[]
              for m in re.finditer(re.escape(word), text, re.I):
                  a=max(0,m.start()-radius); b=min(len(text),m.end()+radius)
                  s=re.sub(r'\s+',' ',text[a:b]).strip()
                  if s not in res: res.append(s)
                  if len(res)>=limit: break
              return res

          lines=[]
          lines.append('# Sofa 3.0 → Growth OS functional gap audit')
          lines.append('')
          lines.append(f'- Sofa live source commit: `{sofa_commit}`')
          lines.append(f'- Current Growth OS title marker: `{re.search(r"<title>(.*?)</title>",growth,re.S).group(1)}`')
          lines.append(f'- Sofa named functions: **{len(sf)}**')
          lines.append(f'- Growth named functions: **{len(gf)}**')
          lines.append(f'- Function names only in Sofa: **{len(unique)}**')
          lines.append('')
          lines.append('## Sofa navigation/page candidates')
          for pid,label in navs(sofa): lines.append(f'- `{pid}` — {label}')
          lines.append('')
          lines.append('## Growth navigation/page candidates')
          for pid,label in navs(growth): lines.append(f'- `{pid}` — {label}')
          lines.append('')
          lines.append('## Function names present in Sofa but absent by name in Growth')
          for x in unique: lines.append(f'- `{x}`')
          lines.append('')
          lines.append('## Sofa unique function source openings')
          for name in unique:
              m=re.search(rf'\bfunction\s+{re.escape(name)}\s*\(',sofa)
              if not m: continue
              s=re.sub(r'\s+',' ',sofa[m.start():m.start()+650]).strip()
              lines.append(f'### `{name}`')
              lines.append('```text')
              lines.append(s)
              lines.append('```')
          lines.append('')
          lines.append('## Keyword evidence')
          for word in keywords:
              ss=snippets(sofa,word,4)
              if not ss: continue
              lines.append(f'### `{word}` — Growth contains keyword: {"yes" if re.search(re.escape(word),growth,re.I) else "no"}')
              for s in ss:
                  lines.append(f'- {s}')
          lines.append('')
          lines.append('## Top-level-like state/data keys in Sofa')
          candidates=sorted(set(re.findall(r'\b(?:state|db|data|S)\.([A-Za-z_$][\w$]*)', sofa)))
          for k in candidates: lines.append(f'- `{k}`')
          lines.append('')
          lines.append('## API routes in Sofa')
          for route in sorted(set(re.findall(r"['\"](/api[^'\"]*)['\"]",sofa))): lines.append(f'- `{route}`')
          lines.append('')
          lines.append('## Local/session storage keys in Sofa')
          for key in sorted(set(re.findall(r"(?:localStorage|sessionStorage)\.(?:getItem|setItem)\(['\"]([^'\"]+)['\"]",sofa))): lines.append(f'- `{key}`')

          Path('audit').mkdir(exist_ok=True)
          Path('audit/SOFA3_GAP_REPORT.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines[:140]))
          PY

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/SOFA3_GAP_REPORT.md
          git commit -m "Add Sofa 3.0 functional gap report" || exit 0
          git push
