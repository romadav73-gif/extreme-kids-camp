name: Build Growth OS 6.5 Sofa unique merge

on:
  push:
    branches: [growth65-sofa3-merge]
    paths:
      - growth6-source/sofa3_merge_v1.js
      - growth6-source/sofa3_merge_v1.css
      - growth6-source/patch_team_access_v1.py
      - .github/workflows/build-growth65-sofa3-merge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth65-sofa3-merge
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and syntax check
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile growth6-source/patch_team_access_v1.py
          python3 growth6-source/patch_team_access_v1.py
          python3 <<'PY'
          import json,re
          from pathlib import Path
          html=Path('growth-os/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if not scripts: raise SystemExit('Application script missing')
          app=max(scripts,key=len)
          Path('/tmp/growth65.js').write_text(app,encoding='utf-8')
          build=json.loads(Path('growth-os/BUILD.json').read_text(encoding='utf-8'))
          assert build['featureVersion']=='6.5-sofa-operations',build
          for marker in (
            'SOFA3_UNIQUE_MERGE_V1_START',
            "label:'Операционный день'",
            'function renderOperations()',
            'function sofa3ReportText(',
            'function sofa3WeekScore(',
            'const SOFA3_BASE_SALARY=100000',
            'const SOFA3_MEETING_TEMPLATES=',
            'СОФА · МОТИВАЦИЯ УПРАВЛЯЮЩЕЙ',
            'Сохранить встречу и создать задачи',
            'MANAGEMENT_UP_V1_START',
            'ATTENDANCE_INTELLIGENCE_V1_START',
            'TEAM_CABINETS_ACCESS_V1_START',
          ):
            if marker not in html: raise SystemExit('Missing marker: '+marker)
          PY
          node --check /tmp/growth65.js

      - name: Browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          python3 -m http.server 8765 --directory growth-os >/tmp/growth65-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          key='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

          run_dom () {
            local name="$1"; local hash="$2"
            timeout 60s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --virtual-time-budget=18000 --dump-dom "http://127.0.0.1:8765/#w=ek65-${GITHUB_RUN_ID}-${name}&k=${key}&${hash}&t=release" >"/tmp/${name}.html" 2>"/tmp/${name}.log" || true
            grep -Fq '<div class="app-shell" id="appShell">' "/tmp/${name}.html"
            if grep -Fq 'id="bootText">Ошибка запуска' "/tmp/${name}.html"; then echo "Runtime boot failed: ${name}"; exit 1; fi
          }

          run_dom owner_ops 'r=owner&v=operations'
          grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/owner_ops.html
          grep -Fq 'ОПЕРАЦИОННЫЙ ЦЕНТР' /tmp/owner_ops.html
          grep -Fq 'ГОТОВНОСТЬ ДНЯ' /tmp/owner_ops.html
          grep -Fq 'Три результата дня' /tmp/owner_ops.html
          grep -Fq 'Операционный день' /tmp/owner_ops.html

          run_dom manager_ops 'r=manager&v=operations'
          grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/manager_ops.html
          grep -Fq 'Мотивация Софы' /tmp/manager_ops.html

          run_dom owner_meeting 'r=owner&v=meeting'
          grep -Fq '<h1 id="pageTitle">Собрание УП</h1>' /tmp/owner_meeting.html
          grep -Fq 'Роман + Софа' /tmp/owner_meeting.html
          grep -Fq 'Собрание администраторов' /tmp/owner_meeting.html
          grep -Fq 'Воронка продаж' /tmp/owner_meeting.html
          grep -Fq 'Качество и дисциплина' /tmp/owner_meeting.html
          grep -Fq 'Закрытие месяца' /tmp/owner_meeting.html
          grep -Fq 'Сохранить встречу и создать задачи' /tmp/owner_meeting.html
          grep -Fq 'id="meetingTimerValue"' /tmp/owner_meeting.html

          run_dom owner_payroll 'r=owner&v=payroll'
          grep -Fq '<h1 id="pageTitle">ЗП и мотивация</h1>' /tmp/owner_payroll.html
          grep -Fq 'СОФА · МОТИВАЦИЯ УПРАВЛЯЮЩЕЙ' /tmp/owner_payroll.html
          grep -Fq 'База 100 000 ₽' /tmp/owner_payroll.html

          run_dom manager_payroll 'r=manager&v=payroll'
          grep -Fq 'СОФА · МОТИВАЦИЯ УПРАВЛЯЮЩЕЙ' /tmp/manager_payroll.html

          run_dom mentor_forbidden_ops 'r=mentor&p=tasya&v=operations'
          if grep -Fq '<h1 id="pageTitle">Операционный день</h1>' /tmp/mentor_forbidden_ops.html; then echo 'Ordinary mentor can access operations'; exit 1; fi

          run_dom tasya_tasks 'r=mentor&p=tasya&v=tasks'
          grep -Fq 'только мои' /tmp/tasya_tasks.html
          if grep -Fq '<h4>Подготовить «Арбузные зарубы»</h4>' /tmp/tasya_tasks.html; then echo 'Task privacy regressed'; exit 1; fi

          run_dom ivan_tasks 'r=mentor&p=ivan&v=tasks'
          grep -Fq 'Все ответственные' /tmp/ivan_tasks.html

          run_dom attendance 'r=owner&v=attendance'
          grep -Fq '<h1 id="pageTitle">Посещаемость</h1>' /tmp/attendance.html
          grep -Fq 'Фактическая плотность' /tmp/attendance.html

      - name: Commit tested build to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6-source/v6.5.html growth6-source/SHA256.txt growth-os growth-os-6 growth61-live
          if git diff --cached --quiet; then echo 'Build already current'; exit 0; fi
          git commit -m "Build Growth OS 6.5 Sofa unique merge"
          git push

      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          cat /tmp/growth65-http.log 2>/dev/null || true
          for name in owner_ops manager_ops owner_meeting owner_payroll manager_payroll mentor_forbidden_ops tasya_tasks ivan_tasks attendance; do
            echo "--- ${name} ---"
            cat "/tmp/${name}.log" 2>/dev/null | tail -40 || true
            grep -E 'pageTitle|bootText|Операционный|Мотивация Софы|СОФА|Собрание|Воронка|Качество|Закрытие месяца' "/tmp/${name}.html" 2>/dev/null | head -60 || true
          done
