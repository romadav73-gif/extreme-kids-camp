name: SMM 6.5 release verification
on:
  push:
    branches: [feature/karina-smm-20260911]
    paths: ['smm65/**', '.github/workflows/smm65-release-verification.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smm65-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4bfae20bce0cd0bfd873a2db08734ece399457ff
          path: previous
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved source and isolated application
        run: |
          node smm65/finalize.cjs
          node smm65/layout-fix.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('smm65/tests/browser-test.py')
          s=p.read_text()
          s=s.replace("'Предварительный расчёт' in k.locator('#pages').inner_text()", "'предварительный расчёт' in k.locator('#pages').inner_text().lower()")
          s=s.replace("wait_for_function(\"document.querySelector('#sm65FormError').textContent.length>0\")", "wait_for_function(\"() => document.querySelector('#sm65FormError')?.textContent.length > 0\")")
          s=s.replace("            check('No horizontal overflow ' + str(width)", "            if k.evaluate('document.documentElement.scrollWidth>innerWidth+1'):\n                print('OVERFLOW', k.evaluate(\"Array.from(document.querySelectorAll('body *')).filter(e=>e.getBoundingClientRect().right>innerWidth+1&&e.getBoundingClientRect().width>0).slice(0,15).map(e=>({tag:e.tagName,cls:e.className,right:e.getBoundingClientRect().right,width:e.getBoundingClientRect().width}))\"), flush=True)\n                k.screenshot(path=str(ROOT/'evidence/overflow.png'),full_page=True)\n            check('No horizontal overflow ' + str(width)")
          p.write_text(s)
          PY
          ln -s ../previous/secure-growth65 smm65/base
          cd previous/secure-growth65
          node scripts/build.cjs
      - run: pip install playwright==1.55.0
      - name: Server permission and motivation tests
        working-directory: smm65
        run: |
          mkdir -p evidence
          set -o pipefail
          node --test tests/*.test.mjs verify-approved.test.mjs | tee evidence/server.tap
      - name: Browser SMM workflows
        working-directory: smm65
        run: |
          node tests/local-server.mjs > evidence/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8894/login >/dev/null && break || sleep 1; done
          python tests/browser-test.py
      - name: Finalize only verified module source
        if: success() && github.event_name == 'push'
        run: |
          git fetch origin feature/karina-smm-20260911
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo 'Branch changed; refusing overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smm65/src smm65/tests
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize verified SMM cabinet, approved compensation and responsive layout'
            git push origin HEAD:feature/karina-smm-20260911
          fi
          git rev-parse HEAD > smm65/evidence/verified-commit.txt
      - name: Preserve exact module sources
        if: always()
        run: |
          mkdir -p smm65/evidence/release-source
          cp -r smm65/src smm65/tests smm65/evidence/release-source/
          find smm65/src -type f -exec sha256sum {} \; > smm65/evidence/source-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smm65-release-evidence
          path: smm65/evidence/
          retention-days: 14
