name: VerifyProductionSite
on:
  push:
    paths:
      - .github/workflows/verify-production-site.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable public HTML
        shell: bash
        run: |
          set -euo pipefail
          url="https://rawcdn.githack.com/romadav73-gif/extreme-kids-camp/6fb8a09a2e6de88a33e966c3f1a99c590ca382e9/index.html"
          curl -L --fail --retry 3 --max-time 90 -sS -o /tmp/site.html "$url"
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,hashlib
          s=Path('/tmp/site.html').read_text(encoding='utf-8')
          assert len(s.encode())>2_500_000
          assert '5 ДНЕЙ.' in s and 'ДВИЖЕНИЕ.' in s and 'ВПЕЧАТЛЕНИЯ.' in s
          assert '<b>Иван</b>' in s and '<b>Стас</b>' in s
          assert 'BANDA BOX' in s and 'KIBERone' in s
          assert s.count('data:image/')>=7
          def sha(uri): return hashlib.sha256(base64.b64decode(uri.split(',',1)[1])).hexdigest()
          mi=re.search(r"\{name:'Иван'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          ms=re.search(r"\{name:'Стас'.*?img:'(data:image/jpeg;base64,[^']+)'",s,re.S)
          assert mi and ms
          assert sha(mi.group(1))=='2f3c7e0c749e7985741b5750c9dccfd9ae83831d5dbd2f31dafc07b9ff889680'
          assert sha(ms.group(1))=='557cf39ddd7302ca0e1f6de4f9417d251ee37d1351126993b4d0d8ee847166cc'
          print('PUBLIC_HTML_OK',len(s.encode()),s.count('data:image/'))
          PY
      - name: Browser smoke test
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat >/tmp/check.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const url='https://rawcdn.githack.com/romadav73-gif/extreme-kids-camp/6fb8a09a2e6de88a33e966c3f1a99c590ca382e9/index.html';
            for(const [w,h] of [[1440,1000],[430,932],[390,844]]){
              const ctx=await browser.newContext({viewport:{width:w,height:h},reducedMotion:'reduce'});
              const page=await ctx.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              await page.goto(url,{waitUntil:'load',timeout:90000});
              await page.waitForTimeout(700);
              const r=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,vw:innerWidth,imgs:[...document.images].map(i=>[i.complete,i.naturalWidth,i.naturalHeight]),body:document.body.innerText}));
              if(r.sw>r.vw+3) throw new Error(`overflow ${w}: ${r.sw}/${r.vw}`);
              if(errors.length) throw new Error(errors.join(';'));
              if(!r.body.includes('5 ДНЕЙ.')||!r.body.includes('Иван')||!r.body.includes('Стас')) throw new Error('visible content missing');
              if(r.imgs.some(x=>!x[0]||x[1]<100||x[2]<100)) throw new Error('broken image');
              console.log('VIEW_OK',w,h,'images',r.imgs.length);
              await ctx.close();
            }
            await browser.close();
            console.log('BROWSER_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH="$PWD/node_modules" node /tmp/check.cjs
