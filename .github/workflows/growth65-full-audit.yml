name: Growth OS 6.5 full audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/growth65-full-audit.yml'
      - '.github/scripts/growth65-full-audit.cjs'
      - 'growth-os/audit65-fixes.patch.js'
  workflow_dispatch:
    inputs:
      mode:
        description: 'production or candidate'
        default: production
        type: choice
        options: [production, candidate]
permissions:
  contents: read
concurrency:
  group: growth65-full-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIT_MODE: ${{ github.event.inputs.mode || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Full isolated browser audit
        run: node .github/scripts/growth65-full-audit.cjs
      - name: Save audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth65-full-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 14
