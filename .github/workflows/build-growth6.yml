name: Build and verify EXTREME KIDS Growth OS 6.0

on:
  pull_request:
    branches: [main]
    paths:
      - growth6-final/**
      - .github/workflows/build-growth6.yml
  push:
    branches: [main]
    paths:
      - growth6-final/**
      - .github/workflows/build-growth6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-os-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Growth OS 6 from the working application core
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, gzip, hashlib, json, pathlib, re

          root=pathlib.Path('.')
          source=root/'growth5'
          parts=[source/f'p{i}.b64' for i in range(7)]
          missing=[str(p) for p in parts if not p.exists()]
          if missing:
              raise RuntimeError('Missing application core parts: '+', '.join(missing))
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          html=gzip.decompress(base64.b64decode(encoded,validate=True)).decode('utf-8')
          original_sha=hashlib.sha256(html.encode()).hexdigest()

          required=[
              'function pageAnalytics',
              'function pageArchive',
              'function pageDashboard',
              'window.go=function',
              'async function syncNow',
              'mantledb.sh/v2/',
              'const navOwner=',
          ]
          absent=[x for x in required if x not in html]
          if absent:
              raise RuntimeError('The application core is incomplete: '+', '.join(absent))

          # Product identity and visible version.
          html=re.sub(r'<title>.*?</title>','<title>EXTREME KIDS · Growth OS 6.0</title>',html,count=1,flags=re.S)
          html=html.replace("const BUILD='2026.08.29-growth-os-5.3-black-gold-production';","const BUILD='2026.08.30-growth-os-6.0-production';")
          html=html.replace("const BUILD='2026.08.29-growth-os-5.2-premium';","const BUILD='2026.08.30-growth-os-6.0-production';")
          html=html.replace('<h1>Growth OS 5.2</h1>','<h1>Growth OS <span>6.0</span></h1>')
          html=html.replace('<div class="brand-copy"><b>Growth OS 5.2</b><span>Учебный год 2026/27</span></div>','<div class="brand-copy"><b>Growth OS <span class="brand-version">6.0</span></b><span>Управление развитием клуба</span></div>')
          html=html.replace("$('#buildText').textContent='5.2 Premium · данные и архивы сохраняются автоматически';","$('#buildText').textContent='Growth OS 6.0 · автосохранение и общая база';")

          # Fix the actual navigation defect: renderPage rebuilds the menu, therefore
          # renderNav itself must output the active class.
          old_d='`<button data-id="${n[0]}" onclick="go(\'${n[0]}\')"><span class="ico">${n[1]}</span>${n[2]}${n[0]===\'tasks\'?`<span class="badge">${roleTasks().filter(t=>t.status!==\'done\').length}</span>`:\'\'}</button>`'
          new_d='`<button class="${UI.page===n[0]?\'active\':\'\'}" data-id="${n[0]}" onclick="go(\'${n[0]}\')"><span class="ico">${n[1]}</span>${n[2]}${n[0]===\'tasks\'?`<span class="badge">${roleTasks().filter(t=>t.status!==\'done\').length}</span>`:\'\'}</button>`'
          old_m='`<button data-id="${x[0]}" onclick="go(\'${x[0]}\')">${x[1]}</button>`'
          new_m='`<button class="${UI.page===x[0]?\'active\':\'\'}" data-id="${x[0]}" onclick="go(\'${x[0]}\')">${x[1]}</button>`'
          if old_d not in html or old_m not in html:
              raise RuntimeError('Navigation templates changed; refusing an unsafe patch')
          html=html.replace(old_d,new_d,1).replace(old_m,new_m,1)

          # Remove previous experimental runtime overlays if present.
          html=re.sub(r'\n?<script id="ek-no-green-runtime">.*?</script>\s*','\n',html,flags=re.S)
          html=re.sub(r'\n?<script id="ek-growth-os-6-smoke-hook">.*?</script>\s*','\n',html,flags=re.S)

          base_theme=(root/'growth5-v54/theme.css').read_text(encoding='utf-8')
          final_theme=(root/'growth6-final/theme-extra.css').read_text(encoding='utf-8')
          theme='<style id="ek-growth-os-6-theme">\n'+base_theme+'\n'+final_theme+'\n</style>\n'
          if '</head>' not in html:
              raise RuntimeError('HTML head is malformed')
          html=html.replace('</head>',theme+'</head>',1)

          # Expose a narrow diagnostic API without changing the persisted data schema.
          expose="window.EKGrowthOS={version:'6.0.0',navigate:id=>window.go(id),sync:()=>syncNow(),getState:()=>S,getPage:()=>UI.page,render:()=>renderPage(),diagnostics:()=>({role,page:UI.page,revision,updatedAt:S?.updatedAt||0,groups:S?.growth?.groups?.length||0,tasks:S?.tasks?.length||0,events:S?.events?.length||0})};\nboot();\n})();"
          if 'boot();\n})();' not in html:
              raise RuntimeError('Application bootstrap marker is missing')
          html=html.replace('boot();\n})();',expose,1)

          smoke=r'''<script id="ek-growth-os-6-smoke-hook">
          (()=>{const p=new URLSearchParams(location.search);if(p.get('smoke')!=='1')return;const sleep=ms=>new Promise(r=>setTimeout(r,ms));const wait=async(fn,timeout=18000)=>{const s=Date.now();while(Date.now()-s<timeout){try{if(fn())return}catch(_e){}await sleep(90)}throw new Error('Timeout waiting for application')};const fail=e=>{document.title='GROWTH6_SMOKE_FAIL';const x=document.createElement('pre');x.id='growth6-smoke-result';x.textContent='GROWTH6_SMOKE_FAIL\n'+String(e&&e.stack||e);document.body.appendChild(x)};window.__growth6Errors=[];addEventListener('error',e=>window.__growth6Errors.push(String(e.error||e.message||'window error')));addEventListener('unhandledrejection',e=>window.__growth6Errors.push(String(e.reason||'unhandled rejection')));addEventListener('load',async()=>{try{await wait(()=>window.EKGrowthOS&&document.querySelector('#app:not(.hidden)')&&document.querySelectorAll('#nav [data-id]').length>=10);const cs=getComputedStyle(document.documentElement),yellow=(cs.getPropertyValue('--ek-yellow').trim()||cs.getPropertyValue('--yellow').trim()).toLowerCase(),font=parseFloat(getComputedStyle(document.body).fontSize);if(window.EKGrowthOS.version!=='6.0.0')throw new Error('Wrong version '+window.EKGrowthOS.version);if(!yellow.includes('f0c72f')&&!yellow.includes('240, 199, 47'))throw new Error('Wrong yellow '+yellow);if(font<16)throw new Error('Font too small '+font);const views=['dashboard','analytics','year','groups','strategy','tasks','calendar','events','archive','stas','teamboards','admin','coach'],ok=[];for(const view of views){window.EKGrowthOS.navigate(view);await sleep(110);const page=document.querySelector('#content'),txt=(page?.innerText||'').trim();if(!page||page.children.length===0||txt.length<18)throw new Error('Empty view '+view);if(/\bundefined\b|\bNaN\b/.test(txt))throw new Error('Invalid value in '+view);if(!document.querySelector(`#nav [data-id="${view}"].active`))throw new Error('Active tab missing '+view);ok.push(view+':ok')}window.EKGrowthOS.navigate('analytics');await sleep(160);if(!document.querySelector('#content .analytics-page'))throw new Error('Analytics page missing');if(document.querySelectorAll('#content svg,#content .donut,#content .month-bars').length<3)throw new Error('Analytics charts missing');window.EKGrowthOS.navigate('tasks');await sleep(100);window.taskForm();await sleep(100);if(document.querySelector('#modal')?.classList.contains('hidden'))throw new Error('Task modal failed');window.closeModal();await Promise.race([window.EKGrowthOS.sync(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Sync timeout')),15000))]);await wait(()=>document.querySelector('#syncText')?.textContent.includes('Синхронизировано'),6000);if(window.__growth6Errors.length)throw new Error(window.__growth6Errors.join(' | '));document.title='GROWTH6_SMOKE_OK';const x=document.createElement('pre');x.id='growth6-smoke-result';x.textContent='GROWTH6_SMOKE_OK\n'+ok.join('\n')+'\nyellow='+yellow+'\nfont='+font+'\nsync=ok';document.body.appendChild(x)}catch(e){fail(e)}},{once:true})})();
          </script>'''
          if '</body>' not in html:
              raise RuntimeError('HTML body is malformed')
          html=html.replace('</body>',smoke+'\n</body>',1)

          final_bytes=html.encode('utf-8')
          final_sha=hashlib.sha256(final_bytes).hexdigest()
          out=root/'growth6'
          out.mkdir(exist_ok=True)
          (out/'index.html').write_bytes(final_bytes)
          report={
              'version':'6.0.0','status':'assembled','source_sha256':original_sha,
              'production_sha256':final_sha,'bytes':len(final_bytes),
              'native_analytics':True,'native_archive':True,'navigation_patch':True,
              'theme':'warm-black-yellow','minimum_font_px':16
          }
          (root/'growth6-test-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Static integrity and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Growth OS 6.0' growth6/index.html
          grep -q 'window.EKGrowthOS' growth6/index.html
          grep -q 'function pageAnalytics' growth6/index.html
          grep -q 'function pageArchive' growth6/index.html
          grep -q '#f0c72f' growth6/index.html
          python3 <<'PY'
          import pathlib,re
          html=pathlib.Path('growth6/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,flags=re.S|re.I)
          if len(scripts)<2: raise SystemExit('Expected application and smoke scripts')
          out=pathlib.Path('/tmp/growth6-scripts');out.mkdir(exist_ok=True)
          for i,s in enumerate(scripts):(out/f'{i}.js').write_text(s,encoding='utf-8')
          print('scripts',len(scripts))
          PY
          for f in /tmp/growth6-scripts/*.js; do node --check "$f"; done

      - name: Verify synchronization CORS for the production origin
        shell: bash
        run: |
          set -euo pipefail
          ns="ek6-cors-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          url="https://mantledb.sh/v2/${ns}/workspace"
          status=$(curl --silent --show-error --output /tmp/preflight.body --dump-header /tmp/preflight.headers --write-out '%{http_code}' --request OPTIONS --header 'Origin: https://extreme-kids-roller-control-v6.vercel.app' --header 'Access-Control-Request-Method: POST' --header 'Access-Control-Request-Headers: content-type' "$url")
          cat /tmp/preflight.headers
          test "$status" -ge 200; test "$status" -lt 300
          grep -qi '^access-control-allow-origin: \(\*\|https://extreme-kids-roller-control-v6.vercel.app\)' /tmp/preflight.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/preflight.headers

      - name: Browser smoke test every tab, analytics, modal, and encrypted sync
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory growth6 >/tmp/growth6-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          key='0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
          url="http://127.0.0.1:8765/index.html?smoke=1#w=ek6-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}&k=${key}&r=owner&t=rm4-7fe3c3b625ec4d88ab125d"
          timeout 55s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-web-security --ignore-certificate-errors --virtual-time-budget=32000 --dump-dom "$url" >/tmp/growth6-dom.html 2>/tmp/growth6-chrome.log || true
          cat /tmp/growth6-chrome.log
          cat /tmp/growth6-dom.html
          grep -q 'GROWTH6_SMOKE_OK' /tmp/growth6-dom.html
          ! grep -q 'GROWTH6_SMOKE_FAIL' /tmp/growth6-dom.html
          grep -q 'analytics:ok' /tmp/growth6-dom.html
          grep -q 'archive:ok' /tmp/growth6-dom.html
          grep -q 'sync=ok' /tmp/growth6-dom.html

      - name: Mark verified
        shell: bash
        run: |
          python3 <<'PY'
          import json,pathlib
          p=pathlib.Path('growth6-test-report.json');d=json.loads(p.read_text(encoding='utf-8'))
          d.update(status='verified',tabs_tested=13,browser_smoke='passed',analytics_charts='passed',sync_roundtrip='passed',cors='passed')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publish verified application to production directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p growth5-live
          cp growth6/index.html growth5-live/index.html
          cp growth6-test-report.json growth5-live/verification.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add growth6/index.html growth6-test-report.json growth5-live/index.html growth5-live/verification.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish verified EXTREME KIDS Growth OS 6.0"
          git push
