name: Management sync smoke test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify repository static file availability
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --dump-header /tmp/static.headers \
            --output /tmp/static.html \
            "https://cdn.jsdelivr.net/gh/romadav73-gif/extreme-kids-camp@management-sync/management-sync/test.html?ci=${GITHUB_RUN_ID}"
          cat /tmp/static.headers
          grep -q 'TEST HTML OK' /tmp/static.html

      - name: Verify direct synchronized storage
        shell: bash
        run: |
          set -euo pipefail
          ns="ek-sync-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          url="https://mantledb.sh/v2/${ns}/state"

          echo '--- JSON preflight ---'
          preflight=$(curl --silent --show-error \
            --output /tmp/preflight.body \
            --dump-header /tmp/preflight.headers \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://romadav73-gif.github.io' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type' \
            "$url")
          cat /tmp/preflight.headers
          cat /tmp/preflight.body || true
          test "$preflight" -ge 200
          test "$preflight" -lt 300
          grep -qi '^access-control-allow-origin: \(\*\|https://romadav73-gif.github.io\)' /tmp/preflight.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/preflight.headers
          grep -qi '^access-control-allow-headers:.*content-type' /tmp/preflight.headers

          echo '--- Write ---'
          write=$(curl --silent --show-error \
            --output /tmp/write.body \
            --dump-header /tmp/write.headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://romadav73-gif.github.io' \
            --header 'Content-Type: application/json' \
            --data '{"data":"management-sync-ok"}' \
            "$url")
          cat /tmp/write.headers
          cat /tmp/write.body
          test "$write" -ge 200
          test "$write" -lt 300
          grep -qi '^access-control-allow-origin: \(\*\|https://romadav73-gif.github.io\)' /tmp/write.headers

          echo '--- Read ---'
          curl --fail --silent --show-error \
            --header 'Origin: https://romadav73-gif.github.io' \
            --dump-header /tmp/read.headers \
            --output /tmp/read.body \
            "$url"
          cat /tmp/read.headers
          cat /tmp/read.body
          grep -qi '^access-control-allow-origin: \(\*\|https://romadav73-gif.github.io\)' /tmp/read.headers
          grep -q 'management-sync-ok' /tmp/read.body
