name: Management sync smoke test

on:
  push:
    branches:
      - management-sync
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://ek-ui2-api.vercel.app/api/health?ci=${GITHUB_RUN_ID}" \
            | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"storage":"connected"' /tmp/health.json

      - name: Verify browser CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            --output /tmp/options.body \
            --dump-header /tmp/options.headers \
            --write-out '%{http_code}' \
            --request OPTIONS \
            --header 'Origin: https://cdn.jsdelivr.net' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,authorization' \
            'https://ek-ui2-api.vercel.app/api/session')
          cat /tmp/options.headers
          cat /tmp/options.body || true
          test "$code" -ge 200
          test "$code" -lt 300
          grep -qi '^access-control-allow-origin: \(\*\|https://cdn.jsdelivr.net\)' /tmp/options.headers
          grep -qi '^access-control-allow-methods:.*POST' /tmp/options.headers
          grep -qi '^access-control-allow-headers:.*content-type' /tmp/options.headers

      - name: Verify static HTML delivery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --dump-header /tmp/static.headers \
            --output /tmp/static.html \
            "https://cdn.jsdelivr.net/gh/romadav73-gif/extreme-kids-camp@management-sync/management-sync/test.html?ci=${GITHUB_RUN_ID}"
          cat /tmp/static.headers
          grep -qi '^content-type:.*text/html' /tmp/static.headers
          grep -q 'TEST HTML OK' /tmp/static.html
