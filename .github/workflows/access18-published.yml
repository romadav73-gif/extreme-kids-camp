name: Access18 published authentication and mobile verification
on:
  push:
    branches: [fix/logout-mobile-20260918]
    paths: ['.github/workflows/access18-published.yml', 'access18/verify.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install playwright==1.55.0 pyyaml
      - name: Prepare pinned auth service and synthetic accounts only
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          steps=yaml.safe_load(Path('.github/workflows/access18-diagnose.yml').read_text())['jobs']['inspect']['steps']
          prepare=next(s['run'] for s in steps if s.get('name','').startswith('Prepare only'))
          start=prepare.index("base='https://extreme-kids-growth")
          end=prepare.index('\nPY',start)
          prepare=prepare[:start]+prepare[end:]
          Path('/tmp/prepare.sh').write_text(prepare)
          PY
          bash -e /tmp/prepare.sh
      - name: Exact published frontend user workflows
        run: python access18/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access18-published-evidence
          path: evidence/
          retention-days: 7
