name: Build EXTREME KIDS Management 4.0

on:
  push:
    branches: [main]
    paths:
      - management4-build.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: management4-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and assemble verified application
        id: assemble
        continue-on-error: true
        shell: bash
        env:
          U0: https://extreme-kids-roller-control-v6-3oms2i9kd.vercel.app/bundle.txt?_vercel_share=NVAMqL8ieT0dMr8OAvodZC1F6Cn0skwp
          U1: https://extreme-kids-roller-control-v6-aaoic8t0n.vercel.app/bundle.txt?_vercel_share=Vz9u8OVKyyQqOpGZ5STgyXHPni8qV82d
          U2: https://extreme-kids-roller-control-v6-6xl1yaapr.vercel.app/bundle.txt?_vercel_share=QOZgBr4BmocyZWpb9xPu0P1FDHhk4LAF
          U3: https://extreme-kids-roller-control-v6-l3nynmbm8.vercel.app/bundle.txt?_vercel_share=3vP0qPF1CKwL6xXOsU5OIRuTFBSvjAW1
          U4: https://extreme-kids-roller-control-v6-pz5difvij.vercel.app/bundle.txt?_vercel_share=TtSNxGQQmc3Gj8WP4Sv390ES4slgZzw3
          U5: https://extreme-kids-roller-control-v6-odclwztnh.vercel.app/bundle.txt?_vercel_share=pprso7ZWemcgDn7hhL02DvU9A8NCaot0
          U6: https://extreme-kids-roller-control-v6-cl80m8fxi.vercel.app/bundle.txt?_vercel_share=bUgNfaBjxiKF5mFgIqBQkoZGf2v9Gyzl
          U70: https://extreme-kids-roller-control-v6-j5kve00re.vercel.app/bundle-part.txt?_vercel_share=sAlWiKkox9x0Xd3DDveW7UTD41ZXYBOV
          U71: https://extreme-kids-roller-control-v6-salk0n5jk.vercel.app/bundle-part.txt?_vercel_share=nSZI4aqPQCAcWaBlOPV2O0cyD9WPCxr8
          U72: https://extreme-kids-roller-control-v6-b6uz6h1tl.vercel.app/bundle-part.txt?_vercel_share=Q2AZFg1JpmQTJ34YepBqo4ksOFbPmEG2
          U73: https://extreme-kids-roller-control-v6-g281nf070.vercel.app/bundle-part.txt?_vercel_share=wdYTPuU319PHW5Khwq7LUH8M63y4lM1V
          U8: https://extreme-kids-roller-control-v6-q2y4aaiy3.vercel.app/bundle.txt?_vercel_share=YjbvsCMuIzcYQzT5dQ1oTZFaBJz3ZRCV
          U9: https://extreme-kids-roller-control-v6-gxhvombh2.vercel.app/bundle.txt?_vercel_share=y0aJzpqnCDs7HTKDgwyy4kAT7xhlNRYJ
        run: |
          set -u
          mkdir -p management4
          python3 <<'PY'
          import base64, gzip, hashlib, http.cookiejar, json, os, pathlib, sys, urllib.request

          order = ['U0','U1','U2','U3','U4','U5','U6','U70','U71','U72','U73','U8','U9']
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          opener.addheaders = [('User-Agent','Mozilla/5.0 EXTREME-KIDS-Builder/4.0')]
          diagnostic = {'parts': [], 'success': False}
          try:
              texts = []
              for key in order:
                  url = os.environ[key]
                  with opener.open(url, timeout=45) as response:
                      body = response.read()
                      text = body.decode('utf-8').strip()
                      item = {
                          'key': key,
                          'status': getattr(response, 'status', 200),
                          'final_url': response.geturl(),
                          'bytes': len(body),
                          'head': text[:16]
                      }
                      diagnostic['parts'].append(item)
                      if item['status'] != 200:
                          raise RuntimeError(f"{key}: HTTP {item['status']}")
                      if text.startswith('<!') or text.startswith('<html') or 'Redirecting' in text[:100]:
                          raise RuntimeError(f"{key}: protection page instead of bundle")
                      texts.append(text)

              joined = ''.join(texts)
              compressed = base64.b64decode(joined, validate=True)
              html = gzip.decompress(compressed)
              digest = hashlib.sha256(html).hexdigest()
              diagnostic.update({
                  'base64_chars': len(joined),
                  'compressed_bytes': len(compressed),
                  'html_bytes': len(html),
                  'sha256': digest
              })
              if len(html) != 175567:
                  raise RuntimeError(f"unexpected HTML size: {len(html)}")
              if digest != 'b86a239e85f611529f53b406b8db5fda9a3ce01787e10ad2554ae44c655fafb2':
                  raise RuntimeError(f"unexpected SHA-256: {digest}")
              decoded = html.decode('utf-8')
              for marker in ('EXTREME KIDS', 'Управление 4.0', '2026.08.23-v4.0-live'):
                  if marker not in decoded:
                      raise RuntimeError(f"missing marker: {marker}")
              pathlib.Path('management4/index.html').write_bytes(html)
              pathlib.Path('management4/README.txt').write_text('EXTREME KIDS Management 4.0 · verified production build\n', encoding='utf-8')
              diagnostic['success'] = True
          except Exception as error:
              diagnostic['error'] = f'{type(error).__name__}: {error}'
              print(diagnostic['error'], file=sys.stderr)
          finally:
              pathlib.Path('management4-build-status.json').write_text(json.dumps(diagnostic, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if not diagnostic['success']:
              sys.exit(1)
          PY

      - name: Commit result and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management4-build-status.json
          if [ -f management4/README.txt ]; then git add management4/index.html management4/README.txt; fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Build EXTREME KIDS Management 4.0"
          git push
