name: Growth 6.5 deep diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/growth65-deep-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --ignore-scripts playwright@1.55.1
      - name: Isolated diagnostics
        env:
          CHROME_PATH: /usr/bin/google-chrome
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
        run: |
          mkdir -p audit-output/repo-source
          cp -r growth-os audit-output/repo-source/
          cp -r .github audit-output/repo-source/github-config
          python3 - <<'PY'
          from pathlib import Path
          source=Path('.github/scripts/growth65-full-audit.cjs').read_text()
          source=source.split('(async()=>{\n const executablePath=')[0]
          source=source.replace("page.on('pageerror'", "page.on('console',async msg=>{if(msg.type()==='warning'||msg.type()==='error'){const args=await Promise.all(msg.args().map(x=>x.evaluate(v=>v instanceof Error?{name:v.name,message:v.message,stack:v.stack}:String(v)).catch(()=>'')));report.console=(report.console||[]);report.console.push({role,args});}});\n page.on('pageerror'")
          Path('.github/scripts/growth65-diag-runner.cjs').write_text(source)
          PY
          cat >> .github/scripts/growth65-diag-runner.cjs <<'JS'
          (async()=>{
           browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
           const cases=[];
           async function test(name,fn){try{const result=await fn();cases.push({name,result});console.log('DIAG '+JSON.stringify({name,result}));}catch(e){cases.push({name,error:String(e),stack:e.stack});console.log('DIAG '+JSON.stringify({name,error:String(e)}));}}
           try{
            const A=await newPage('owner','','diagnostic');const a=A.page;await stable(a);
            await E(a,'state.settings.autoSync=false;persistLocal();clearTimeout(window.__sofa65V4SyncTimer)');
            await test('direct-initial-fetch',()=>E(a,'(async()=>{const r=await fetchRemote();return{exists:!!r,groups:r?.groups?.length,tasks:r?.tasks?.length}})()'));
            await test('crypto-shapes',()=>E(a,'(async()=>{const p=await encryptState(state);const out={type:typeof p};for(const [k,v] of [["string",p],["object",JSON.parse(p)],["wrapper",{data:p}]]){try{const x=await decryptPayload(v);out[k]={exists:!!x,groups:x?.groups?.length,version:x?.version}}catch(e){out[k]={error:e.message}}}return out})()'));
            const B=await newPage('manager','','diagnostic');const b=B.page;await stable(b);await E(b,'state.settings.autoSync=false;persistLocal();clearTimeout(window.__sofa65V4SyncTimer)');
            await test('two-device-counts',async()=>({a:await E(a,'({groups:state.groups.length,tasks:state.tasks.length})'),b:await E(b,'({groups:state.groups.length,tasks:state.tasks.length})')}));
            await test('direct-merge',()=>E(a,'(async()=>{const r=await fetchRemote();const m=mergeStates(state,r);return{groups:m.groups.length,tasks:m.tasks.length}})()'));
            await test('direct-push',()=>E(a,'pushRemote(state)'));
            await test('second-merge',()=>E(b,'(async()=>{const r=await fetchRemote();const m=mergeStates(state,r);return{groups:m.groups.length,tasks:m.tasks.length}})()'));
            await test('create-task-real-form',async()=>{
             await E(a,'setView("tasks");openTaskForm()');
             await a.locator('#taskForm [name=title]').fill('QA ONLY isolated save');
             await a.locator('#taskForm [name=ownerId]').selectOption('sofia');
             await a.locator('#taskForm button[type=submit]').click();
             return E(a,'({task:state.tasks.find(t=>t.title==="QA ONLY isolated save"),sync:syncing})');
            });
            await test('task-sync-call',async()=>{await stable(a);return E(a,'syncNow({quiet:true})')});
            await test('task-receive-call',async()=>{await stable(b);await E(b,'syncNow({quiet:true,push:false})');return E(b,'state.tasks.some(t=>t.title==="QA ONLY isolated save")')});
            await test('concurrent-task-field-merge',()=>E(a,'(()=>{const x=clone(state),y=clone(state);x.tasks=[{id:"qa-conflict",title:"EDIT A",status:"todo",updatedAt:"2026-09-01T00:00:00Z"}];y.tasks=[{id:"qa-conflict",title:"BASE",status:"done",updatedAt:"2026-09-02T00:00:00Z"}];return mergeStates(x,y).tasks})()'));
            await test('concurrent-revenue-merge',()=>E(a,'(()=>{const x=clone(state),y=clone(state),k=state.settings.currentMonth;x.months[k].daily=[{id:"q1",date:k+"-01",amount:100}];y.months[k].daily=[{id:"q2",date:k+"-02",amount:200}];return mergeStates(x,y).months[k].daily})()'));
            const T=await newPage('team','','permissions');const t=T.page;await stable(t);await E(t,'state.settings.autoSync=false;persistLocal()');
            await test('team-event-submit',async()=>{await E(t,'setView("calendar")');await t.locator('[data-action=addEvent]').click();await t.locator('#eventForm [name=title]').fill('QA ONLY read-only permission');await t.locator('#eventForm button[type=submit]').click();return E(t,'state.events.some(e=>e.title==="QA ONLY read-only permission")')});
            await test('team-role-tamper',async()=>{const u=new URL(t.url()),h=new URLSearchParams(u.hash.slice(1));h.set('r','owner');u.hash=h.toString();await t.goto(u.toString());await t.reload();await t.waitForFunction(()=>window.__qa65);await stable(t);return E(t,'({role:currentRole,settings:allowedView("settings")})')});
            const M=await newPage('mentor','tasya','tasya');const m=M.page;await stable(m);await E(m,'state.settings.autoSync=false;persistLocal()');
            await test('mentor-scope',()=>E(m,'({role:currentRole,person:personalMentorId,visibleGroups:activeGroups().length,canEditOther:activeGroups().filter(g=>g.mentorId!==personalMentorId).some(g=>canEditGroup(g)),stateKeys:Object.keys(state)})'));
            await test('function-sources',()=>E(a,'(()=>{const names=["readHash","parseHash","boot","cryptoKey","encryptState","persistLocal","touch","ensureState","seedState","mergeById","__mergeStatesSofa65V4","__mergeStatesSofa3","handleSubmit","__handleSubmitSofa65V4","sofa65V4Pick","clone"];const o={};for(const n of names)try{o[n]=eval(n).toString()}catch{}return o})()'));
            report.deploySecretAvailability={token:process.env.HAS_VERCEL_TOKEN,org:process.env.HAS_VERCEL_ORG,project:process.env.HAS_VERCEL_PROJECT};
           }finally{await browser.close();report.cases=cases;fs.writeFileSync(OUT+'/diagnostics.json',JSON.stringify(report,null,2));console.log('DIAG_CONSOLE '+JSON.stringify(report.console));console.log('DIAG_DEPLOY_SECRETS '+JSON.stringify(report.deploySecretAvailability));}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node .github/scripts/growth65-diag-runner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth65-diagnostics-${{ github.run_id }}
          path: audit-output/
          retention-days: 14
