<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080806">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>EXTREME KIDS · Growth OS 6.5 Sofa Operations</title>
  <link rel="icon" href="https://ek-ui2-logo.vercel.app/logo.webp">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
:root{
  --bg:#080806;
  --bg-deep:#050504;
  --sidebar:#090908;
  --surface:#12110d;
  --surface-2:#17150f;
  --surface-3:#1e1a11;
  --surface-yellow:#262008;
  --line:#342c16;
  --line-soft:#272214;
  --text:#f5eedc;
  --text-2:#ddd3bc;
  --muted:#a79e8c;
  --muted-2:#7d7669;
  --yellow:#f0c72f;
  --yellow-bright:#ffdd5a;
  --yellow-deep:#b98a12;
  --yellow-soft:rgba(240,199,47,.12);
  --yellow-glow:rgba(240,199,47,.22);
  --red:#e57968;
  --red-soft:rgba(229,121,104,.12);
  --green:#dbc65d;
  --blue:#d3b440;
  --shadow:0 22px 70px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.02);
  --shadow-soft:0 12px 38px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.018);
  --radius:22px;
  --radius-sm:15px;
  --sidebar-w:286px;
  --topbar-h:86px;
  --font:Inter,"Segoe UI",Arial,sans-serif;
}

*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 82% -12%,rgba(240,199,47,.12),transparent 32%),
    radial-gradient(circle at -12% 82%,rgba(240,199,47,.06),transparent 30%),
    linear-gradient(180deg,#0d0c09 0%,var(--bg) 38%,#060605 100%);
  color:var(--text);
  font:16px/1.55 var(--font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.desktop-only{display:inline}

.ambient{position:fixed;z-index:-3;border-radius:999px;filter:blur(120px);pointer-events:none;opacity:.9}
.ambient-one{width:420px;height:420px;right:-150px;top:-140px;background:rgba(240,199,47,.09);animation:ambientFloat 15s ease-in-out infinite alternate}
.ambient-two{width:360px;height:360px;left:-180px;bottom:-120px;background:rgba(240,199,47,.055);animation:ambientFloat 19s ease-in-out infinite alternate-reverse}
.noise{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E")}
@keyframes ambientFloat{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-35px,28px,0) scale(1.08)}}

/* Boot */
.boot{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 68% 0,rgba(240,199,47,.13),transparent 36%),linear-gradient(180deg,#0e0c08,#060605);transition:opacity .45s ease,visibility .45s ease}
.boot.fade{opacity:0;visibility:hidden}
.boot-card{width:min(510px,100%);padding:40px 34px;text-align:center;border:1px solid #433617;border-radius:30px;background:linear-gradient(145deg,#1b170d,#0e0d09);box-shadow:0 34px 110px rgba(0,0,0,.58),inset 0 1px 0 rgba(255,239,180,.04)}
.boot-logo-wrap{position:relative;width:112px;height:112px;margin:0 auto 20px;display:grid;place-items:center}
.boot-logo{position:relative;z-index:2;width:92px;height:92px;object-fit:contain;border-radius:22px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.38))}
.boot-ring{position:absolute;inset:0;border:1px solid rgba(240,199,47,.45);border-radius:50%;animation:bootPulse 2.1s ease-in-out infinite}
.boot-ring:after{content:"";position:absolute;inset:10px;border:1px dashed rgba(240,199,47,.28);border-radius:50%;animation:spin 10s linear infinite}
.boot h1{margin:7px 0 8px;font-size:38px;letter-spacing:-.045em;line-height:1.05}
.boot h1 span{color:var(--yellow-bright)}
.boot p{margin:0;color:var(--muted);font-size:16px}
.boot-progress{height:5px;width:min(270px,80%);margin:24px auto 0;overflow:hidden;border-radius:99px;background:#29220f}
.boot-progress i{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--yellow-deep),var(--yellow-bright));box-shadow:0 0 22px rgba(240,199,47,.28);animation:bootLoad 1.15s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bootPulse{0%,100%{transform:scale(.93);opacity:.45}50%{transform:scale(1.04);opacity:1}}
@keyframes bootLoad{from{transform:translateX(-130%)}to{transform:translateX(340%)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Layout */
.app-shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:60;width:var(--sidebar-w);display:flex;flex-direction:column;padding:22px 18px 18px;background:linear-gradient(180deg,#080807,#0b0a08 55%,#080807);border-right:1px solid #2c2513;box-shadow:20px 0 70px rgba(0,0,0,.24)}
.main{grid-column:2;min-width:0;min-height:100vh}
.content{max-width:1680px;margin:0 auto;padding:24px 28px 50px}
.topbar{position:sticky;top:0;z-index:45;height:var(--topbar-h);display:flex;align-items:center;justify-content:space-between;gap:22px;padding:0 28px;background:rgba(9,9,8,.86);border-bottom:1px solid #2d2614;backdrop-filter:blur(20px) saturate(125%);box-shadow:0 12px 38px rgba(0,0,0,.12)}
.top-title{display:flex;align-items:center;gap:14px;min-width:0}
.top-title h1{margin:0;font-size:30px;line-height:1.08;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb,.eyebrow{font-size:11px;line-height:1.2;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--yellow)}
.top-actions{display:flex;align-items:center;gap:10px}

.brand{display:flex;align-items:center;gap:13px;padding:2px 4px 20px}
.brand-logo{width:58px;height:58px;object-fit:contain;border-radius:16px;background:#11100c;border:1px solid #3e3216;box-shadow:0 10px 26px rgba(0,0,0,.32)}
.brand-copy{min-width:0}
.brand-copy b{display:block;font-size:18px;letter-spacing:.01em;color:var(--text)}
.brand-copy b span{color:var(--yellow-bright)}
.brand-copy small{display:block;margin-top:3px;color:var(--muted);font-size:12px}
.workspace-pill{display:flex;align-items:center;gap:11px;margin:0 2px 18px;padding:13px 14px;border-radius:15px;background:linear-gradient(145deg,#18150d,#11100c);border:1px solid #352c17}
.workspace-pill b{display:block;font-size:13px;color:var(--text-2)}
.workspace-pill small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.workspace-dot{width:10px;height:10px;flex:0 0 auto;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 5px rgba(240,199,47,.1),0 0 18px rgba(240,199,47,.18)}
.workspace-dot.busy{animation:dotPulse 1s ease-in-out infinite}
.workspace-dot.off{background:var(--red);box-shadow:0 0 0 5px rgba(229,121,104,.1)}
@keyframes dotPulse{50%{opacity:.42;transform:scale(.84)}}

.nav{display:flex;flex:1;min-height:0;overflow-y:auto;flex-direction:column;gap:5px;padding:0 2px 12px;scrollbar-width:thin;scrollbar-color:#433815 transparent}
.nav-section{margin:17px 10px 6px;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#736b59}
.nav-btn{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:12px 13px;border:1px solid transparent;border-radius:13px;background:transparent;color:#b7ae9d;text-align:left;font-size:15px;font-weight:720;transition:transform .2s ease,color .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.nav-btn:hover{transform:translateX(2px);background:#19160d;color:#f1e3b2}
.nav-btn.active{background:linear-gradient(90deg,rgba(240,199,47,.23),rgba(240,199,47,.055));border-color:rgba(240,199,47,.2);color:#ffe27d;box-shadow:inset 3px 0 0 var(--yellow),0 10px 28px rgba(0,0,0,.18)}
.nav-icon{width:22px;height:22px;display:grid;place-items:center;flex:0 0 auto;color:#a58f48}
.nav-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active .nav-icon{color:var(--yellow-bright);filter:drop-shadow(0 0 7px rgba(240,199,47,.2))}
.nav-badge{margin-left:auto;min-width:22px;padding:2px 7px;border-radius:99px;background:#29220e;border:1px solid #493b17;color:#d8bd62;font-size:11px;text-align:center}
.sidebar-footer{display:flex;align-items:center;gap:10px;padding:15px 4px 0;border-top:1px solid #272113}
.profile-mini{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.profile-mini b{display:block;font-size:14px}
.profile-mini small{display:block;color:var(--muted);font-size:11px}
.avatar{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;border-radius:14px;background:linear-gradient(145deg,var(--yellow-bright),#c99413);color:#171106;font-weight:950;box-shadow:0 8px 22px rgba(240,199,47,.13)}
.avatar.small{width:34px;height:34px;border-radius:11px;font-size:13px}

/* Controls */
.btn,.icon-btn,.role-button,.mobile-menu-btn{border:0;outline:0}
.btn{min-height:43px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:13px;font-size:14px;font-weight:850;transition:transform .18s cubic-bezier(.2,.7,.2,1),background .18s ease,border-color .18s ease,box-shadow .18s ease,color .18s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn-primary{background:linear-gradient(180deg,var(--yellow-bright),var(--yellow));border:1px solid #ffe889;color:#171106;box-shadow:0 10px 30px rgba(240,199,47,.16)}
.btn-primary:hover{background:linear-gradient(180deg,#ffe477,#f2c633);box-shadow:0 13px 38px rgba(240,199,47,.24)}
.btn-ghost{background:#17140d;border:1px solid #3a311a;color:#d7ccb5}
.btn-ghost:hover{border-color:#5d4b1e;color:#f4e5b5;background:#1d190e}
.btn-danger{background:#291815;border:1px solid #59302a;color:#f1b5aa}
.btn-small{min-height:36px;padding:7px 11px;border-radius:10px;font-size:13px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#17140d;border:1px solid #392f18;color:#bdb29e;font-size:22px;transition:transform .18s ease,background .18s ease,color .18s ease,border-color .18s ease}
.icon-btn:hover{transform:translateY(-1px);background:#211c0e;border-color:#594719;color:var(--yellow-bright)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.close-btn{font-size:26px}
.role-button{height:48px;display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:15px;background:linear-gradient(145deg,#18150e,#11100c);border:1px solid #382f18;color:var(--text)}
.role-button b,.role-button small{display:block;text-align:left;line-height:1.15}
.role-button b{font-size:13px}.role-button small{margin-top:3px;color:var(--muted);font-size:10px}
.role-button svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:2}
.role-switch{position:relative}
.popover{position:absolute;right:0;top:56px;z-index:100;width:270px;padding:9px;border-radius:17px;background:#12110d;border:1px solid #403519;box-shadow:0 24px 80px rgba(0,0,0,.5);animation:popoverIn .18s ease both}
.popover button{width:100%;display:flex;align-items:center;gap:10px;padding:11px;border:0;border-radius:11px;background:transparent;color:var(--text-2);text-align:left}
.popover button:hover{background:#211c0e;color:var(--yellow-bright)}
@keyframes popoverIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.month-select-wrap{height:48px;display:flex;align-items:center;gap:9px;padding:6px 11px;border:1px solid #382f18;border-radius:14px;background:#15130d}
.month-select-wrap>span{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#8f846e}
.select,.input,.textarea{width:100%;color:var(--text);background:#13120d;border:1px solid #3b321b;border-radius:12px;outline:none;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
.select{height:45px;padding:0 12px}.select.compact{height:34px;min-width:145px;padding:0 6px;border:0;background:transparent;font-weight:800;color:#e8dbbd}
.input{height:46px;padding:0 13px}.textarea{min-height:110px;padding:12px 13px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:#91711d;box-shadow:0 0 0 3px rgba(240,199,47,.09);background:#17140d}
.field{display:grid;gap:7px}
.field label{font-size:12px;font-weight:800;color:#c4b79c}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .span-2{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #2c2515}
.check{display:flex;align-items:center;gap:9px;color:var(--text-2)}
.check input{width:18px;height:18px;accent-color:var(--yellow)}
.sync-spinner{width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(240,199,47,.08)}
.sync-spinner.busy{background:transparent;border:2px solid rgba(240,199,47,.28);border-top-color:var(--yellow);box-shadow:none;animation:spin .7s linear infinite}
.mobile-menu-btn{display:none;width:42px;height:42px;place-items:center;border-radius:12px;background:#17140d;border:1px solid #392f18}
.mobile-menu-btn span{display:block;width:18px;height:2px;margin:3px 0;background:#d9ceb6;border-radius:99px}

/* Page shells and cards */
.page{display:grid;gap:18px;animation:pageIn .38s cubic-bezier(.2,.72,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:2px}
.page-head h2{margin:4px 0 0;font-size:27px;line-height:1.15;letter-spacing:-.025em}
.page-head p{margin:7px 0 0;color:var(--muted);font-size:15px}
.page-actions{display:flex;gap:9px;flex-wrap:wrap}
.card{position:relative;overflow:hidden;border-radius:var(--radius);background:linear-gradient(145deg,var(--surface-2),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow-soft);transition:transform .23s cubic-bezier(.2,.72,.2,1),border-color .23s ease,box-shadow .23s ease,background .23s ease}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(240,199,47,.6),transparent);opacity:.58}
.card:hover{transform:translateY(-2px);border-color:#55451d;box-shadow:0 28px 68px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.02)}
.card.pad{padding:20px}
.card.hero{padding:24px;background:radial-gradient(circle at 90% 0,rgba(240,199,47,.15),transparent 40%),linear-gradient(145deg,#24200f,#11100c);border-color:#57451b;box-shadow:var(--shadow)}
.card.hero:after{content:"";position:absolute;inset:auto -90px -120px auto;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(240,199,47,.08),transparent 65%);pointer-events:none}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.card-head h3{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.015em}
.card-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.card-tools{display:flex;gap:8px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(330px,.75fr);gap:16px}
.stack{display:grid;gap:14px}

.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:22px}
.hero-title{margin:8px 0 5px;font-size:24px}
.hero-value{font-size:48px;line-height:1;font-weight:950;letter-spacing:-.055em;color:var(--yellow-bright);text-shadow:0 0 30px rgba(240,199,47,.14)}
.hero-sub{margin-top:7px;color:var(--muted);font-size:14px}
.hero-actions{display:flex;gap:9px;margin-top:17px;flex-wrap:wrap}
.hero-progress{height:10px;margin-top:22px;overflow:hidden;border-radius:99px;background:#2a2516;border:1px solid #3c3218}
.hero-progress i{position:relative;display:block;height:100%;min-width:0;border-radius:99px;background:linear-gradient(90deg,#a97912,var(--yellow),var(--yellow-bright));box-shadow:0 0 20px rgba(240,199,47,.24);transition:width .7s cubic-bezier(.2,.7,.2,1)}
.hero-progress i:after,.progress i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,249,211,.28),transparent);transform:translateX(-120%);animation:shimmer 2.8s ease-in-out infinite}
@keyframes shimmer{50%,100%{transform:translateX(160%)}}
.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.zone{padding:11px 12px;border-radius:13px;background:#18160f;border:1px solid #342d1b}
.zone b,.zone small{display:block}.zone b{font-size:15px}.zone small{margin-top:2px;color:var(--muted);font-size:10px}
.zone.active{background:linear-gradient(145deg,#342a08,#1a160b);border-color:#80611a;box-shadow:inset 0 0 0 1px rgba(240,199,47,.08),0 10px 28px rgba(0,0,0,.2)}
.zone.active b{color:var(--yellow-bright)}
.zone.red{background:#261714;border-color:#4b2b26}

.metric-card{padding:18px 18px 16px}
.metric-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.metric-label{font-size:12px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#c2a74a}
.metric-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#282109;border:1px solid #4d3e16;color:var(--yellow-bright)}
.metric-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.metric-value{margin-top:10px;font-size:32px;line-height:1;font-weight:950;letter-spacing:-.045em;color:var(--text)}
.metric-sub{margin-top:7px;color:var(--muted);font-size:13px}
.metric-trend{display:inline-flex;align-items:center;gap:4px;margin-top:10px;padding:4px 8px;border-radius:99px;background:#27210d;color:#d9c270;font-size:11px;font-weight:800}
.progress{height:7px;margin-top:13px;overflow:hidden;border-radius:99px;background:#292517}
.progress i{position:relative;display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a87c16,var(--yellow-bright));transition:width .6s ease}

.priority-list,.signal-list,.event-list,.compact-list{display:grid;gap:9px}
.priority-item,.signal-item,.event-item,.compact-item{display:flex;align-items:flex-start;gap:12px;padding:13px;border-radius:14px;background:#15130d;border:1px solid #302917;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.priority-item:hover,.event-item:hover,.compact-item:hover{transform:translateX(2px);background:#1b170d;border-color:#4b3c17}
.item-index{width:26px;height:26px;display:grid;place-items:center;flex:0 0 auto;border-radius:9px;background:linear-gradient(145deg,var(--yellow-bright),#c69012);color:#181106;font-size:12px;font-weight:950}
.item-dot{width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px rgba(240,199,47,.28);flex:0 0 auto}
.item-dot.red{background:var(--red);box-shadow:0 0 12px rgba(229,121,104,.22)}
.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:14px}.item-main small{display:block;margin-top:3px;color:var(--muted);font-size:12px;line-height:1.35}
.item-meta{flex:0 0 auto;color:#c7b56b;font-size:12px;font-weight:800}
.empty{padding:28px;text-align:center;border:1px dashed #4c3f1b;border-radius:18px;background:#14120d;color:var(--muted)}
.empty b{display:block;margin-bottom:4px;color:var(--text-2);font-size:16px}

/* Tables */
.table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#11100c;box-shadow:var(--shadow-soft)}
.data-table{width:100%;border-collapse:separate;border-spacing:0;min-width:920px}
.data-table th,.data-table td{padding:13px 14px;border-bottom:1px solid #2c2617;text-align:left;vertical-align:middle}
.data-table th{position:sticky;top:0;z-index:2;background:#1c180f;color:#bcb09a;font-size:11px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.data-table td{font-size:14px;color:#d7ceb9}

.table-title{display:flex;align-items:center;gap:10px}.table-title b{display:block;color:var(--text)}.table-title small{display:block;color:var(--muted);font-size:11px}
.discipline-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#282109;border:1px solid #4b3c16;color:var(--yellow-bright);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;background:#29230f;border:1px solid #453817;color:#d9c47c;font-size:11px;font-weight:800;white-space:nowrap}
.pill.red{background:#2d1b18;border-color:#57302b;color:#e7a49a}
.pill.muted{background:#1b1913;border-color:#363024;color:#aaa291}
.load-cell{min-width:140px}.load-cell b{display:block;margin-bottom:5px;color:var(--text)}
.loadbar{height:7px;border-radius:99px;background:#2a2518;overflow:hidden}.loadbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a97c13,var(--yellow-bright))}.loadbar i.red{background:linear-gradient(90deg,#8e453a,var(--red))}
.table-actions{display:flex;gap:6px}.table-actions button{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1b180f;border:1px solid #3b3118;color:#bdb39f}.table-actions button:hover{background:#29220e;color:var(--yellow-bright);border-color:#5b481a}

/* Tabs, filters, segmented */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px;border-radius:17px;background:#12110d;border:1px solid #342c18}

.segmented button.active{background:#342a0c;color:#ffe17d;box-shadow:inset 0 0 0 1px #5b4717}
.search{position:relative;min-width:250px}.search .input{padding-left:39px}.search svg{position:absolute;left:13px;top:13px;width:19px;height:19px;fill:none;stroke:#8f856f;stroke-width:2}

/* Kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(270px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.kanban-col{min-height:420px;padding:13px;border-radius:18px;background:#100f0c;border:1px solid #312a19}
.kanban-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;padding:3px 2px 10px;border-bottom:1px solid #2b2517}.kanban-head b{font-size:14px}.kanban-head span{min-width:24px;padding:2px 7px;border-radius:99px;background:#2a230e;color:#d9c26f;font-size:11px;text-align:center}
.task-card{padding:13px;margin-bottom:9px;border-radius:14px;background:linear-gradient(145deg,#1a170f,#13110c);border:1px solid #332c19;box-shadow:0 8px 22px rgba(0,0,0,.17);transition:transform .18s ease,border-color .18s ease,background .18s ease}
.task-card:hover{transform:translateY(-2px);background:#1d190f;border-color:#514119}
.task-card .task-top{display:flex;justify-content:space-between;gap:8px}.task-card h4{margin:0;font-size:14px;line-height:1.35}.task-card p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.35}
.task-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #2a2417;color:#aaa18f;font-size:11px}.priority-mark{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.priority-mark.high{background:var(--red)}.priority-mark.low{background:#7f775e}

/* Calendar */
.calendar-shell{display:grid;gap:14px}
.calendar-week{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;color:#9f9684;font-size:11px;font-weight:900;text-align:center;text-transform:uppercase;letter-spacing:.08em}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(115px,1fr));gap:7px}
.calendar-day{min-height:132px;padding:10px;border-radius:15px;background:#12110d;border:1px solid #302918;transition:background .18s ease,border-color .18s ease,transform .18s ease}
.calendar-day:hover{transform:translateY(-2px);background:#17140d;border-color:#4b3c18}
.calendar-day.off{opacity:.5}.calendar-day.today{background:linear-gradient(145deg,#2a230c,#15130c);border-color:#6d5518;box-shadow:inset 0 0 0 1px rgba(240,199,47,.08)}
.calendar-date{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;font-weight:900;color:#d9d0bd}.calendar-day.today .calendar-date{color:var(--yellow-bright)}
.calendar-events{display:grid;gap:5px}.calendar-event{padding:5px 7px;border-radius:8px;background:#282109;border-left:3px solid var(--yellow);color:#e6d28c;font-size:10px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}.calendar-event.camp{border-left-color:#ffdd5a}.calendar-event.competition{border-left-color:#f0c72f}.calendar-event.gathering{border-left-color:#b88b16}.calendar-event.deadline{border-left-color:var(--red);background:#281815;color:#e5a096}
.event-tabs{display:flex;gap:7px;flex-wrap:wrap}.event-tab{padding:8px 12px;border-radius:11px;border:1px solid #3a3119;background:#17140d;color:#aaa18e;font-size:12px;font-weight:800}.event-tab.active{background:#352b0c;border-color:#6c5518;color:#ffe17d}

/* Analytics */
.analytics-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:24px;border-radius:23px;background:radial-gradient(circle at 90% 0,rgba(240,199,47,.18),transparent 42%),linear-gradient(145deg,#251f0d,#11100c);border:1px solid #594718;box-shadow:var(--shadow)}
.analytics-hero h2{margin:7px 0 7px;font-size:29px}.forecast-value{font-size:50px;line-height:1;font-weight:950;letter-spacing:-.055em;color:var(--yellow-bright);text-align:right}.forecast-status{margin-top:7px;text-align:right;color:#c2b490;font-size:13px}
.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.scenario{padding:13px;border-radius:14px;background:#18160f;border:1px solid #342d1b}.scenario.active{background:#30270a;border-color:#725817;box-shadow:inset 0 0 0 1px rgba(240,199,47,.08)}.scenario span,.scenario b,.scenario small{display:block}.scenario span{font-size:11px;color:#b6a865}.scenario b{margin-top:3px;font-size:20px;color:var(--yellow-bright)}.scenario small{margin-top:2px;color:var(--muted);font-size:10px}
.chart-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px}.chart-panel{padding:19px;border-radius:20px;background:linear-gradient(145deg,#18160f,#11100d);border:1px solid #342c18;box-shadow:var(--shadow-soft)}.chart-panel h3{margin:0;font-size:18px}.chart-panel p{margin:5px 0 0;color:var(--muted);font-size:12px}.chart{width:100%;height:260px;margin-top:12px}.chart svg{width:100%;height:100%;overflow:visible}.chart-axis{stroke:#3b321d;stroke-width:1}.chart-gridline{stroke:#2e2819;stroke-width:1;stroke-dasharray:5 6}.chart-line{fill:none;stroke:var(--yellow-bright);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(240,199,47,.23));stroke-dasharray:1800;stroke-dashoffset:1800;animation:drawLine 1.15s cubic-bezier(.2,.7,.2,1) forwards}.chart-area{fill:url(#goldArea);opacity:.23}.chart-dot{fill:var(--yellow-bright);stroke:#17130a;stroke-width:2}.chart-bar{fill:var(--yellow);rx:7;transform-origin:bottom;animation:barUp .75s cubic-bezier(.2,.7,.2,1) both}.chart-bar.soft{fill:#765a16}.chart-bar.hot{fill:var(--yellow-bright)}.chart-label{fill:#aaa08b;font-size:11px}.chart-value{fill:#f0d978;font-size:12px;font-weight:900}.donut-wrap{display:grid;place-items:center;position:relative;height:260px}.donut-wrap svg{width:210px;height:210px}.donut-track{fill:none;stroke:#2c2719;stroke-width:18}.donut-value{fill:none;stroke:var(--yellow);stroke-width:18;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(240,199,47,.18));transition:stroke-dasharray .7s ease}.donut-center{position:absolute;text-align:center}.donut-center b{display:block;font-size:38px;letter-spacing:-.04em}.donut-center small{color:var(--muted)}
.probability-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.probability{padding:14px;border-radius:14px;background:#17150f;border:1px solid #342c19}.probability b{display:block;margin-top:5px;font-size:25px;color:var(--yellow-bright)}.probability small{color:var(--muted);font-size:11px}
.recommendations{display:grid;gap:9px}.recommendation{display:flex;gap:11px;padding:13px;border-radius:14px;background:#15130d;border:1px solid #302918}.recommendation i{width:9px;height:9px;margin-top:6px;flex:0 0 auto;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px rgba(240,199,47,.23)}.recommendation b{display:block}.recommendation span{display:block;margin-top:3px;color:var(--muted);font-size:13px}
@keyframes drawLine{to{stroke-dashoffset:0}}
@keyframes barUp{from{transform:scaleY(.05);opacity:.2}to{transform:scaleY(1);opacity:1}}

/* Year, goals, role dashboards */
.month-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.month-card{padding:17px}.month-card.current{border-color:#6d5518;box-shadow:0 0 0 2px rgba(240,199,47,.07),var(--shadow-soft)}.month-top{display:flex;justify-content:space-between;gap:10px}.month-name{font-size:18px;font-weight:900}.month-focus{margin:8px 0 0;color:var(--muted);font-size:12px;min-height:36px}.month-values{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:13px}.month-values div{padding:8px;border-radius:10px;background:#1a170e;border:1px solid #342c18}.month-values span,.month-values b{display:block}.month-values span{font-size:9px;color:#8f856f;text-transform:uppercase}.month-values b{margin-top:2px;font-size:13px}.month-card .progress{margin-top:13px}
.goal-list{display:grid;gap:10px}.goal-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 120px 110px auto;align-items:center;gap:12px;padding:14px;border-radius:15px;background:#15130d;border:1px solid #302918}.goal-title b{display:block}.goal-title small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.goal-progress b{display:block;margin-bottom:5px;font-size:12px}.goal-owner{font-size:12px;color:#d2c6ad}.goal-deadline{font-size:12px;color:#b8ad98}
.role-hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.role-score{display:flex;align-items:center;gap:18px}.score-ring{--p:0;width:126px;height:126px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:conic-gradient(var(--yellow) calc(var(--p)*1%),#2b2618 0);position:relative}.score-ring:before{content:"";position:absolute;inset:13px;border-radius:50%;background:#15130d;border:1px solid #372f1b}.score-ring b{position:relative;font-size:30px}.score-copy h3{margin:0;font-size:23px}.score-copy p{margin:7px 0 0;color:var(--muted)}

/* Archive */
.archive-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.archive-card{padding:17px}.archive-card .archive-value{margin-top:8px;font-size:29px;font-weight:950;color:var(--yellow-bright)}.archive-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:13px}.archive-meta div{padding:9px;border-radius:10px;background:#19160e;border:1px solid #342c18}.archive-meta span,.archive-meta b{display:block}.archive-meta span{font-size:9px;color:#8f856f;text-transform:uppercase}.archive-meta b{font-size:13px}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;background:rgba(2,2,2,.76);backdrop-filter:blur(10px);animation:modalFade .18s ease both}
.modal-card{width:min(760px,100%);max-height:min(88vh,920px);overflow:auto;border-radius:24px;background:linear-gradient(145deg,#1a170f,#100f0c);border:1px solid #51411b;box-shadow:0 35px 120px rgba(0,0,0,.64);animation:modalPop .23s cubic-bezier(.2,.72,.2,1) both}
.modal-head{position:sticky;top:0;z-index:3;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 22px 18px;background:rgba(20,18,13,.95);border-bottom:1px solid #302918;backdrop-filter:blur(14px)}
.modal-head h2{margin:6px 0 0;font-size:25px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.modal-body{padding:21px 22px 24px}
@keyframes modalFade{from{opacity:0}to{opacity:1}}@keyframes modalPop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.quick-card{display:flex;align-items:center;gap:12px;padding:15px;border-radius:15px;background:#17140d;border:1px solid #3a3119;color:var(--text-2);text-align:left}.quick-card:hover{background:#27210c;border-color:#6a5219;color:var(--yellow-bright)}.quick-icon{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border-radius:12px;background:#2b240b;border:1px solid #4f3e15;color:var(--yellow-bright);font-size:18px}.quick-card b,.quick-card small{display:block}.quick-card small{margin-top:3px;color:var(--muted);font-size:11px}
.toast-stack{position:fixed;right:20px;bottom:20px;z-index:300;display:grid;gap:8px;width:min(360px,calc(100vw - 40px))}.toast{padding:13px 14px;border-radius:14px;background:#1c180f;border:1px solid #514119;color:#f2e5c5;box-shadow:0 18px 55px rgba(0,0,0,.45);animation:toastIn .25s ease both}.toast.error{background:#281815;border-color:#63352e;color:#f0b0a6}.toast small{display:block;margin-top:2px;color:#a99f8b}
@keyframes toastIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* Settings */
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.settings-block{padding:19px}.settings-block h3{margin:0 0 5px}.settings-block p{margin:0 0 16px;color:var(--muted);font-size:13px}.key-box{padding:12px;border-radius:12px;background:#0d0c09;border:1px dashed #4b3d1b;color:#a99f8c;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;word-break:break-all}

/* Mobile nav */
.mobile-nav{position:fixed;left:10px;right:10px;bottom:10px;z-index:80;display:none;grid-template-columns:repeat(5,1fr);padding:7px;border-radius:19px;background:rgba(13,12,9,.94);border:1px solid #3a3018;box-shadow:0 20px 70px rgba(0,0,0,.5);backdrop-filter:blur(18px)}
.mobile-nav button{display:grid;place-items:center;gap:2px;padding:6px 3px;border:0;border-radius:11px;background:transparent;color:#948b79;font-size:9px;font-weight:800}.mobile-nav button.active{background:#30270a;color:var(--yellow-bright)}.mobile-nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.65);backdrop-filter:blur(2px)}

/* Responsive */
@media(max-width:1280px){
  :root{--sidebar-w:260px}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .month-grid,.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

}

  .sidebar.open{transform:translateX(0)}
  .topbar{height:var(--topbar-h)}
  .mobile-menu-btn{display:grid}
  .mobile-nav{display:grid!important}
  .top-title h1{font-size:23px}
  .crumb{font-size:9px}
  .desktop-only{display:none!important}
  .month-select-wrap{display:none}
  .content{padding:18px 14px 32px}
  .grid-2,.grid-3,.grid-4,.month-grid,.archive-grid,.settings-grid{grid-template-columns:1fr}
  .zones{grid-template-columns:repeat(2,1fr)}
  .hero-top{display:block}.hero-value{margin-top:18px;font-size:42px}
  .page-head{align-items:flex-start;flex-direction:column}.page-actions{width:100%}.page-actions .btn{flex:1}
  .form-grid{grid-template-columns:1fr}.form-grid .span-2{grid-column:auto}

  .analytics-hero{padding:19px}.analytics-hero h2{font-size:24px}.forecast-value{font-size:40px}

}
@media(max-width:560px){
  body{font-size:16px}
  .topbar{padding:0 12px;gap:8px}

  .top-title h1{max-width:48vw;font-size:20px}
  .card.pad,.card.hero{padding:17px}
  .grid-4{gap:10px}.metric-card{padding:15px}.metric-value{font-size:29px}
  .hero-value{font-size:37px}
  .zones{grid-template-columns:1fr 1fr}
  .probability-grid{grid-template-columns:1fr 1fr}
  .chart{height:220px}
  .modal{padding:10px}.modal-card{border-radius:20px}.modal-head{padding:18px 17px 14px}.modal-body{padding:17px}
  .search{min-width:100%;width:100%}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.task-actions-inline{display:flex;align-items:center;gap:8px;margin-left:auto}.task-delete{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;border:1px solid #4b2d26;background:#251512;color:#db8b7d;opacity:.78;transition:.18s}.task-delete:hover{opacity:1;transform:translateY(-1px);border-color:#805046;background:#321b17}.task-delete svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}.task-card .task-top{align-items:flex-start}.goal-progress small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.role-hero a.btn{text-decoration:none}

async function fetchRemote(){

}

async function syncNow({quiet=false,push=true}={}){

 try{
  const remote=await fetchRemote();const merged=mergeStates(state,remote);const changed=JSON.stringify(merged)!==JSON.stringify(state);state=merged;persistLocal();
  if(push||!remote||String(state.meta.updatedAt)>String(remote.meta?.updatedAt))await pushRemote(state);
  setSyncStatus('ok','Общая база обновлена');if(changed){suppressRender=true;renderShell();renderCurrentView();suppressRender=false}if(!quiet)toast('Данные синхронизированы','Все устройства увидят изменения.');return true;

function calendarData(monthKey){const [y,m]=monthKey.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),start=(first.getDay()+6)%7,prevDays=new Date(y,m-1,0).getDate(),cells=[];for(let i=0;i<42;i++){let day=i-start+1,cy=y,cm=m,off=false;if(day<1){day=prevDays+day;cm=m-1;if(cm===0){cm=12;cy--}off=true}else if(day>last.getDate()){day-=last.getDate();cm=m+1;if(cm===13){cm=1;cy++}off=true}const date=`${cy}-${String(cm).padStart(2,'0')}-${String(day).padStart(2,'0')}`;cells.push({day,date,off})}return cells}

function lineChart(values,target=0){const W=760,H=250,P=30,vals=values.length?values:[0],max=Math.max(target,...vals,1)*1.08,xy=vals.map((v,i)=>[P+(W-2*P)*(i/Math.max(1,vals.length-1)),H-P-(H-2*P)*(v/max)]),line=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),area=line+` L ${W-P} ${H-P} L ${P} ${H-P} Z`,ty=H-P-(H-2*P)*(target/max);return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="goldArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdd5a"/><stop offset="1" stop-color="#f0c72f" stop-opacity="0"/></linearGradient></defs>${[.25,.5,.75].map(r=>`<line class="chart-gridline" x1="${P}" y1="${P+(H-2*P)*r}" x2="${W-P}" y2="${P+(H-2*P)*r}"/>`).join('')}<line class="chart-axis" x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}"/>${target?`<line x1="${P}" y1="${ty}" x2="${W-P}" y2="${ty}" stroke="#7a6017" stroke-dasharray="7 6"/>`:''}<path class="chart-area" d="${area}"/><path class="chart-line" d="${line}"/>${xy.map(p=>`<circle class="chart-dot" cx="${p[0]}" cy="${p[1]}" r="4"/>`).join('')}</svg>`}

function formValues(form){return Object.fromEntries(new FormData(form).entries())}

 if(f.id==='groupForm'){const old=state.groups.find(x=>x.id===f.dataset.id);const item={...(old||{}),id:old?.id||id('grp'),mentorId:v.mentorId,name:v.name,discipline:v.discipline,day:v.day,time:v.time,level:v.level,capacity:num(v.capacity),students:num(v.students),monthlyPrice:num(v.monthlyPrice),prime:/1[6-9]:|20:|Суббота|Воскресенье/.test(v.time+' '+v.day),status:'active',updatedAt:stamp};upsert(state.groups,item);closeModal();touch(`Группа: ${item.name}`)}

function payrollClone(value){return JSON.parse(JSON.stringify(value))}
function salaryMoney(value){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(value)||0)+' ₽'}
function activeAdmins(){return (state?.people||[]).filter(p=>p.role==='admin'&&p.active!==false&&!p.archivedAt&&!p.deletedAt)}
function activeMentors(){return (state?.people||[]).filter(p=>(p.role==='mentor'||p.id==='stas')&&p.active!==false&&!p.archivedAt&&!p.deletedAt)}
function payrollEnsure(s){
  if(!s||typeof s!=='object')return s;
  s.settings=s.settings||{};
  const incoming=s.settings.adminCompensation||{};
  s.settings.adminCompensation={...payrollClone(DEFAULT_ADMIN_COMPENSATION),...incoming,bonusTiers:Array.isArray(incoming.bonusTiers)&&incoming.bonusTiers.length?incoming.bonusTiers:payrollClone(DEFAULT_ADMIN_COMPENSATION.bonusTiers)};
  s.settings.uiScale=clamp(Number(s.settings.uiScale)||1.1,1,1.22);
  s.adminOperationsByMonth=s.adminOperationsByMonth&&typeof s.adminOperationsByMonth==='object'?s.adminOperationsByMonth:{};
  s.mentorPayroll=Array.isArray(s.mentorPayroll)?s.mentorPayroll:[];
  s.adminSalarySnapshots=s.adminSalarySnapshots&&typeof s.adminSalarySnapshots==='object'?s.adminSalarySnapshots:{};
  if(!s.adminSalarySnapshots['2026-08'])s.adminSalarySnapshots['2026-08']=payrollClone(AUGUST_ADMIN_SNAPSHOT);
  if(!s.months['2026-08'])s.months['2026-08']={key:'2026-08',label:'Август 2026',minimum:2500000,target:2500000,stretch:3500000,fact:2162988,daily:[],focus:'Исторический расчёт зарплаты администраторов',loadTarget:75,updatedAt:'2026-08-31T23:59:59.000Z'};
  s.people=(s.people||[]).map(p=>({...p,active:p.active!==false}));
  s.ui={...(s.ui||{}),selectedAdmin:s.ui?.selectedAdmin||'anya',selectedMentor:s.ui?.selectedMentor||'stas',payrollTab:s.ui?.payrollTab||'all'};
  s.meta=s.meta||{};s.meta.build=PAYROLL_EXTENSION_BUILD;
  return s;
}

  if(!s||typeof s!=='object')return s;
  s.people=Array.isArray(s.people)?s.people:[];
  s.people=s.people.map(p=>{
    const out={...p};
    if(out.id==='ivan'){
      out.title='Старший наставник';
      out.taskAccess='all';
      out.active=out.active!==false;
    }
    return out;
  });
  s.ui={...(s.ui||{}),staffTab:s.ui?.staffTab||'active'};
  s.meta=s.meta||{};
  s.meta.teamAccessBuild=TEAM_ACCESS_BUILD;

function managementEnsure(s){
  if(!s||typeof s!=='object')return s;
  s.people=Array.isArray(s.people)?s.people:[];
  s.people=s.people.map(p=>{
    const meta=MANAGEMENT_BOARD_META[p.id];
    return meta?{...p,...meta,managementBoard:true,groupAccess:'all',taskAccess:'all'}:{...p,managementBoard:false};
  });
  s.staffDocuments=Array.isArray(s.staffDocuments)?s.staffDocuments:[];
  s.staffDuties=Array.isArray(s.staffDuties)?s.staffDuties:[];
  s.meetingAgenda=Array.isArray(s.meetingAgenda)?s.meetingAgenda:[];
  s.meetingTimer={running:false,startedAt:null,elapsedSec:0,updatedAt:'',...(s.meetingTimer||{})};
  s.ui={...(s.ui||{}),staffKnowledgePerson:s.ui?.staffKnowledgePerson||'ivan'};
  s.meta=s.meta||{};
  s.meta.managementUpBuild=MANAGEMENT_UP_BUILD;

  const seeded=[
    ['up-duty-roman','roman','Собственник','Стратегия, развитие клуба и финальный управленческий контроль.'],
    ['up-duty-sofia','sofia','Управляющая','Операционное управление клубом и контроль исполнения.'],
    ['up-duty-stas-competitions','stas','Соревнования и сборы','Техническая подготовка соревнований и сборов роллер-школы.'],
    ['up-duty-stas-practice','stas','Практическое обучение','Практическое обучение наставников и детей.'],
    ['up-duty-ivan-training','ivan','Обучение сотрудников','Теоретическое обучение сотрудников и наставников.'],
    ['up-duty-ivan-metrics','ivan','Метрики роллер-школы','Контроль заполненности групп и связанных учебных метрик.'],
    ['up-duty-ivan-method','ivan','Методическая система','Методичка, курсы и единая теоретическая база роллер-школы.']
  ];
  const existing=new Set(s.staffDuties.map(x=>x.id));
  for(const [dutyId,personId,title,description] of seeded){
    if(existing.has(dutyId))continue;
    s.staffDuties.push({id:dutyId,personId,title,description,seeded:true,createdBy:'system',createdAt:'2026-09-03T00:00:00.000Z',updatedAt:'2026-09-03T00:00:00.000Z'});
  }
  return s;
}

function meetingElapsedSec(){
  const t=state.meetingTimer||{};let total=Math.max(0,Number(t.elapsedSec)||0);
  if(t.running&&t.startedAt){const started=new Date(t.startedAt).getTime();if(Number.isFinite(started))total+=Math.max(0,Math.floor((Date.now()-started)/1000));}
  return total;
}

function sofa3EnsureMotivation(key=state.settings.currentMonth){if(!state.sofiaMotivationByMonth[key])state.sofiaMotivationByMonth[key]=sofa3MotivationBase(key);return state.sofiaMotivationByMonth[key]}
function sofa3Month(dateValue){const key=monthKeyFromDate(dateValue),m=state.months[key];return m||{key,label:monthLabel(key),minimum:state.settings.minimumRevenue||0,target:state.settings.normalRevenue||0,stretch:state.settings.strongRevenue||0,fact:0,daily:[]}}
function sofa3RevenueOnDate(dateValue){const m=sofa3Month(dateValue),d=sofa3Date(dateValue);return sum((m.daily||[]).filter(x=>x.date===d&&!x.deletedAt),x=>x.amount)}
function sofa3SalesOnDate(dateValue){
  const d=sofa3Date(dateValue),key=monthKeyFromDate(d),sales=(state.adminOperationsByMonth?.[key]?.sales||[]).filter(x=>!x.deletedAt&&x.date===d);
  const group=sales.filter(x=>x.type==='group'),it=sales.filter(x=>x.type==='it');
  const byAdmin={};for(const s of sales){byAdmin[s.adminId]=byAdmin[s.adminId]||{count:0,amount:0};byAdmin[s.adminId].count++;byAdmin[s.adminId].amount+=Number(s.amount)||0}
  return{sales,groupCount:group.length,groupAmount:sum(group,x=>x.amount),individualCount:it.length,individualAmount:sum(it,x=>x.amount),byAdmin};
}
function sofa3DerivedMetrics(dateValue=sofa3SelectedDate()){
  const d=sofa3Date(dateValue),day=sofa3EnsureDay(d),snapshot=day.report?.snapshot||null,sales=sofa3SalesOnDate(d),current=d===today();
  const load=snapshot&&!current?Number(snapshot.occupancy)||0:loadStats().load;
  const derived={revenue:sofa3RevenueOnDate(d),groupCount:sales.groupCount,groupAmount:sales.groupAmount,individualCount:sales.individualCount,individualAmount:sales.individualAmount,anyaSalesCount:sales.byAdmin.anya?.count||0,anyaSalesAmount:sales.byAdmin.anya?.amount||0,adelSalesCount:sales.byAdmin.adel?.count||0,adelSalesAmount:sales.byAdmin.adel?.amount||0,occupancy:load};
  if(snapshot&&!current){for(const k of Object.keys(derived))if(snapshot[k]!==undefined)derived[k]=snapshot[k]}
  return{...day.metrics,...derived};
}
function sofa3Stats(dateValue=sofa3SelectedDate()){
  const d=sofa3Date(dateValue),day=sofa3EnsureDay(d),m=sofa3Month(d),fact=monthFact(m),plan=Number(m.target)||0,daysInMonth=new Date(Number(d.slice(0,4)),Number(d.slice(5,7)),0).getDate(),dateNumber=Number(d.slice(8,10)),remaining=Math.max(0,plan-fact),remainingDays=Math.max(1,daysInMonth-dateNumber),need=remaining/remainingDays;
  let forecastValue=0;try{forecastValue=forecast(m).base||0}catch{forecastValue=dateNumber?fact/dateNumber*daysInMonth:0}
  const metrics=sofa3DerivedMetrics(d),conversion=Number(metrics.attended)?Number(metrics.sold)/Number(metrics.attended)*100:0,renew=Number(metrics.renewDue)?Number(metrics.renewDone)/Number(metrics.renewDue)*100:0;
  const checks=Object.values(day.checks||{}),rhythm=Object.values(day.rhythm||{}),checkDone=checks.filter(Boolean).length,rhythmDone=rhythm.filter(Boolean).length,readiness=Math.round(((checks.length?checkDone/checks.length:0)*.7+(rhythm.length?rhythmDone/rhythm.length:0)*.3)*100);
  return{date:d,day,m,metrics,fact,plan,remaining,need,forecast:forecastValue,conversion,renew,readiness,checkDone,checkTotal:checks.length,rhythmDone,rhythmTotal:rhythm.length,progress:plan?fact/plan*100:0};
}
function sofa3NextRhythm(day,dateValue=sofa3SelectedDate()){
  const selected=sofa3Date(dateValue),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
  for(let i=0;i<SOFA3_RHYTHM.length;i++){
    if(day.rhythm?.[i])continue;const [time,title,text]=SOFA3_RHYTHM[i],parts=time.split(':').map(Number),mins=parts[0]*60+parts[1];
    if(selected!==today()||mins>=nowMin)return[time,title,text,i];
  }
  return SOFA3_RHYTHM.map((x,i)=>[...x,i]).find(x=>!day.rhythm?.[x[3]])||null;
}
function sofa3Alerts(s){
  const list=[];if(Number(s.metrics.unanswered))list.push({red:true,text:`${s.metrics.unanswered} лид(а) без ответа`});if(Number(s.metrics.unpaidClients))list.push({red:true,text:`${s.metrics.unpaidClients} неоплаченных клиент(а) · ${compactMoney(s.metrics.unpaidAmount)}`});
  const overdue=activeTasks().filter(t=>!statusDone(t.status)&&t.deadline&&t.deadline<s.date).length;if(overdue)list.push({red:true,text:`${overdue} просроченных задач в общей системе`});
  if(Number(s.metrics.cleanliness)>0&&Number(s.metrics.cleanliness)<85)list.push({red:false,text:`Чистота ${Math.round(s.metrics.cleanliness)}% — требуется исправление`});if(s.readiness<55)list.push({red:false,text:`Готовность дня ${s.readiness}% — не закрыты базовые контрольные точки`});return list;
}
function sofa3WeekRevenue(dateValue=sofa3SelectedDate()){const a=sofa3WeekStart(dateValue),b=sofa3WeekEnd(dateValue);let total=0;for(const m of Object.values(state.months||{}))total+=sum((m.daily||[]).filter(x=>!x.deletedAt&&x.date>=a&&x.date<=b),x=>x.amount);return total}
function sofa3WeekTasks(dateValue=sofa3SelectedDate()){const a=sofa3WeekStart(dateValue),b=sofa3WeekEnd(dateValue);return activeTasks().filter(t=>t.ownerId==='sofia'&&t.deadline>=a&&t.deadline<=b)}
function sofa3WeekScore(dateValue=sofa3SelectedDate()){
  const w=sofa3EnsureWeek(dateValue),revenue=sofa3WeekRevenue(dateValue),tasks=sofa3WeekTasks(dateValue),target=Number(w.revenueTarget)||0,components=[];
  if(target)components.push({key:'revenue',score:clamp(revenue/target*100,0,130),weight:50});
  const hasResults=(w.results||[]).some(x=>String(x||'').trim());if(hasResults){const vals=(w.resultStatus||[0,0,0]).map(Number),score=avg(vals)*100;components.push({key:'results',score,weight:30})}
  if(tasks.length){const done=tasks.filter(t=>statusDone(t.status)).length;components.push({key:'tasks',score:done/tasks.length*100,weight:20})}
  const weight=sum(components,x=>x.weight),score=weight?sum(components,x=>x.score*x.weight)/weight:0;return{w,revenue,tasks,target,components,score:clamp(score,0,130)};
}
function sofa3ScoreLabel(score,closed=false){const label=score>=90?'Выполнено':score>=70?'Частично':'Не выполнено';return closed?label:`В работе · ${Math.round(score)}%`}
function sofa3Tier(fact){for(const [threshold,bonus] of SOFA3_TIERS)if(fact>=threshold)return bonus;return 0}
function sofa3Coef(planPct){return planPct>=100?1:planPct>=95?.75:planPct>=90?.5:0}
function sofa3Salary(key=state.settings.currentMonth){
  const m=state.months[key]||sofa3Month(`${key}-01`),mot=sofa3EnsureMotivation(key),fact=monthFact(m),plan=Number(m.target)||0,planPct=plan?fact/plan*100:0,kpiCount=SOFA3_KPIS.filter(([k])=>mot.checks?.[k]).length,kpi=kpiCount*5000,tier=sofa3Tier(fact),coef=sofa3Coef(planPct),variable=tier*coef,total=SOFA3_BASE_SALARY+kpi+variable,final=mot.snapshot?.amount??null;
  return{key,mot,fact,plan,planPct,kpiCount,kpi,tier,coef,variable,total,final,display:final??total};
}

function sofa3ResolveOwner(raw){const q=String(raw||'').trim().toLowerCase();if(!q)return'sofia';const aliases={софа:'sofia',софия:'sofia',роман:'roman',стас:'stas',станислав:'stas',ваня:'ivan',иван:'ivan',аня:'anya',адель:'adel'};if(aliases[q])return aliases[q];const p=(state.people||[]).find(x=>x.id.toLowerCase()===q||String(x.name||'').toLowerCase()===q);return p?.id||'sofia'}

  if(f.id==='sofa3ReportForm'){e.preventDefault();sofa3SaveReportForm(f);touch('Сохранён черновик ежедневного отчёта');return}
  if(f.id==='sofa3WeekForm'){e.preventDefault();const w=sofa3EnsureWeek();w.revenueTarget=num(f.elements.revenueTarget?.value);w.results=[0,1,2].map(i=>f.elements[`result${i}`]?.value||'');for(const key of ['risk','team','parents','improvement','decision'])w[key]=f.elements[key]?.value||'';w.updatedAt=stamp;touch('Обновлён план и результат недели Софы');return}
  if(f.id==='sofa3MeetingForm'){e.preventDefault();if(!isManagementBoard())return;const draft=sofa3MeetingDraftEnsure(),meetingId=id('meet'),template=SOFA3_MEETING_TEMPLATES[draft.type],tasks=sofa3ParseMeetingTasks(draft.tasks,meetingId,draft.date||today(),draft.type),meeting={id:meetingId,type:draft.type,title:template.title,date:draft.date||today(),participants:draft.participants,duration:Number(draft.duration)||template.duration,agenda:draft.agenda.map(x=>({...x})),notes:draft.notes,decision:draft.decision,tasks:tasks.map(x=>x.title),tasksCreated:tasks.length,createdBy:managementActorName(),createdAt:stamp,updatedAt:stamp};state.managementMeetings.push(meeting);state.tasks.push(...tasks);state.managementMeetingDraft=sofa3MeetingDraft(draft.type);touch(`Сохранена встреча «${template.title}»${tasks.length?` · создано задач ${tasks.length}`:''}`);return}
  return __handleSubmitSofa3Base(e)
};

const __handleClickSofa3Base=handleClick;
handleClick=function(e){const el=e.target.closest('[data-action]');if(el){const a=el.dataset.action;
  if(a==='sofa3OpsTab'){state.ui.operationsTab=el.dataset.tab||'today';persistLocal();renderCurrentView();return}
  if(a==='sofa3PrevDay'){state.ui.operationsDate=sofa3AddDays(sofa3SelectedDate(),-1);persistLocal();renderCurrentView();return}
  if(a==='sofa3NextDay'){state.ui.operationsDate=sofa3AddDays(sofa3SelectedDate(),1);persistLocal();renderCurrentView();return}
  if(a==='sofa3Today'){state.ui.operationsDate=today();persistLocal();renderCurrentView();return}
  if(a==='sofa3ToggleCheck'){const d=sofa3EnsureDay();d.checks[el.dataset.key]=!d.checks[el.dataset.key];d.updatedAt=nowIso();touch(`Контроль дня: ${el.dataset.key}`);return}
  if(a==='sofa3ToggleRhythm'){const d=sofa3EnsureDay(),i=Number(el.dataset.index);d.rhythm[i]=!d.rhythm[i];d.updatedAt=nowIso();touch(`Ритм дня: ${SOFA3_RHYTHM[i]?.[1]||i}`);return}
  if(a==='sofa3CopyReport'){copyText(sofa3ReportText(),'Ежедневный отчёт скопирован');return}
  if(a==='sofa3MarkReport'){const form=$('#sofa3ReportForm');if(form)sofa3SaveReportForm(form);const d=sofa3EnsureDay(),s=sofa3Stats();d.checks.close_report=true;d.rhythm[SOFA3_RHYTHM.length-1]=true;d.report.sentAt=nowIso();d.report.snapshot={...s.metrics,readiness:sofa3Stats().readiness,createdAt:nowIso()};d.updatedAt=nowIso();touch('Ежедневный отчёт Роману зафиксирован');return}
  if(a==='sofa3CycleWeekResult'){const w=sofa3EnsureWeek(),i=Number(el.dataset.index),v=Number(w.resultStatus?.[i])||0;w.resultStatus=w.resultStatus||[0,0,0];w.resultStatus[i]=v>=1?0:v>=.5?1:.5;w.updatedAt=nowIso();touch('Обновлён результат недели');return}
  if(a==='sofa3CloseWeek'){const form=$('#sofa3WeekForm');if(form){const w=sofa3EnsureWeek();w.revenueTarget=num(form.elements.revenueTarget?.value);w.results=[0,1,2].map(i=>form.elements[`result${i}`]?.value||'');for(const key of ['risk','team','parents','improvement','decision'])w[key]=form.elements[key]?.value||''}const x=sofa3WeekScore(),done=x.tasks.filter(t=>statusDone(t.status)).length;x.w.closedAt=nowIso();x.w.snapshot={key:x.w.key,status:sofa3ScoreLabel(x.score,true),score:Math.round(x.score),revenue:x.revenue,target:x.target,resultsScore:x.components.find(c=>c.key==='results')?.score||0,tasksDone:done,tasksTotal:x.tasks.length,risk:x.w.risk,decision:x.w.decision,closedAt:x.w.closedAt};x.w.updatedAt=nowIso();touch(`Закрыта управленческая неделя ${x.w.key}`);return}
  if(a==='sofa3ToggleKpi'){if(!['owner','manager'].includes(currentRole))return;const mot=sofa3EnsureMotivation();mot.checks[el.dataset.key]=!mot.checks[el.dataset.key];mot.updatedAt=nowIso();touch(`KPI Софы: ${el.dataset.key}`);return}
  if(a==='sofa3LockSalary'){if(currentRole!=='owner')return;const s=sofa3Salary(),mot=s.mot;mot.closedAt=nowIso();mot.snapshot={amount:Math.round(s.total),base:SOFA3_BASE_SALARY,kpi:s.kpi,tier:s.tier,coef:s.coef,fact:s.fact,plan:s.plan,planPct:s.planPct,closedAt:mot.closedAt};mot.updatedAt=nowIso();touch('Зарплата Софы за месяц зафиксирована Романом');return}
  if(a==='sofa3MeetingTemplate'){if(!isManagementBoard())return;state.managementMeetingDraft=sofa3MeetingDraft(el.dataset.type);state.managementMeetingDraft.updatedAt=nowIso();touch(`Выбран шаблон встречи: ${SOFA3_MEETING_TEMPLATES[el.dataset.type]?.title||el.dataset.type}`);return}
  if(a==='sofa3ToggleMeetingDraftAgenda'){if(!isManagementBoard())return;const d=sofa3MeetingDraftEnsure(),i=Number(el.dataset.index);if(d.agenda[i]){d.agenda[i].done=!d.agenda[i].done;d.updatedAt=nowIso();persistLocal();renderCurrentView()}return}
  if(a==='sofa3OpenDay'){state.ui.operationsDate=el.dataset.date;state.ui.operationsTab='report';persistLocal();setView('operations');return}
 }return __handleClickSofa3Base(e)};

const __handleChangeSofa3Base=handleChange;
handleChange=function(e){const el=e.target;if(el.dataset.filter==='sofa3OpsDate'){state.ui.operationsDate=sofa3Date(el.value);persistLocal();renderCurrentView();return}if(el.dataset.sofaMeetingField){const d=sofa3MeetingDraftEnsure(),key=el.dataset.sofaMeetingField;d[key]=key==='duration'?num(el.value):el.value;d.updatedAt=nowIso();persistLocal();return}return __handleChangeSofa3Base(e)};
const __handleInputSofa3Base=handleInput;
handleInput=function(e){const el=e.target;if(el.dataset.sofaMeetingField){const d=sofa3MeetingDraftEnsure(),key=el.dataset.sofaMeetingField;d[key]=key==='duration'?num(el.value):el.value;d.updatedAt=nowIso();clearTimeout(el.__sofaSave);el.__sofaSave=setTimeout(persistLocal,250);return}return __handleInputSofa3Base(e)};

const __bootSofa3Base=boot;
boot=async function(){const result=await __bootSofa3Base();if(window.EKGrowthOS)window.EKGrowthOS={...window.EKGrowthOS,sofa3MergeBuild:SOFA3_MERGE_BUILD,operationsDay:date=>sofa3Stats(date||today()),sofiaSalary:key=>sofa3Salary(key||state.settings.currentMonth),managementWeek:date=>sofa3WeekScore(date||today())};return result};
// SOFA3_UNIQUE_MERGE_V1_END

document.addEventListener('click',handleClick);
document.addEventListener('submit',handleSubmit);
document.addEventListener('change',handleChange);
document.addEventListener('input',handleInput);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();$('#rolePopover').classList.add('hidden')}});
document.addEventListener('click',e=>{if(!e.target.closest('.role-switch'))$('#rolePopover')?.classList.add('hidden')});
$('#importInput').addEventListener('change',e=>{if(e.target.files?.[0])importFile(e.target.files[0]);e.target.value=''});
window.addEventListener('online',()=>syncNow({quiet:true,push:true}));window.addEventListener('focus',()=>{if(Date.now()-lastRemotePush>10000)syncNow({quiet:true,push:true})});
window.EKGrowthOS={version:VERSION,build:BUILD,getState:()=>state,setView,sync:()=>syncNow({quiet:true,push:true}),credentials:()=>({...credentials}),derived:()=>derivedSnapshot(),canDeleteTask:()=>canDeleteTask(),reset:resetState};
boot();
})();

</script>
