<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f4f1e7"><title>EXTREME KIDS · Growth OS 5.0</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1e7;color:#171811;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.boot{text-align:center;padding:32px}.logo{width:92px;height:92px;object-fit:contain}.boot h1{font-size:32px;margin:14px 0 8px}.boot p{color:#777b70}.bar{width:260px;height:7px;margin:18px auto;background:#e7e2d4;border-radius:99px;overflow:hidden}.bar i{display:block;width:40%;height:100%;background:#f5d400;border-radius:99px;animation:p 1s ease-in-out infinite}@keyframes p{from{transform:translateX(-120%)}to{transform:translateX(330%)}}</style></head><body><div class="boot"><img class="logo" src="https://ek-ui2-logo.vercel.app/logo.webp" alt="EXTREME KIDS"><h1>Growth OS 5.0</h1><p id="status">Загружаю систему развития клуба…</p><div class="bar"><i></i></div></div><script>(async()=>{try{if(!('DecompressionStream'in window))throw Error('Обновите браузер');const names=['p0.b64','p1.b64','p2.b64','p3.b64','p4.b64','p5.b64','p6.b64'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n+'?v=20260829',{cache:'no-store'});if(!r.ok)throw Error(n+' '+r.status);return(await r.text()).trim()}));const raw=atob(parts.join('')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Ошибка запуска: '+e.message;console.error(e)}})();</script></body></html>
